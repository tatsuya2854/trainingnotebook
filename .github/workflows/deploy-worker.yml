# main に push したら Worker（API + www/ の静的配信）を自動デプロイする。
# 必要な GitHub Secrets（リポジトリ → Settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN   Cloudflare の API トークン（Workers 編集 + KV 編集の権限）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウント ID
# どちらかが未設定なら何もしないで終わる（失敗にはしない）。
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "worker/**"
      - "scripts/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        id: check
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare の Secrets が未設定なのでデプロイをスキップします"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build www/
        if: steps.check.outputs.ready == 'true'
        run: node scripts/build-www.mjs
      - name: Install worker deps
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm ci
      - name: Typecheck
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm run typecheck
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
