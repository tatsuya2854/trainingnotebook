# iOS アプリを GitHub の Mac でビルドして TestFlight（App Store Connect）に送る。手元に Mac は要らない。
#
# 必要な GitHub Secrets（リポジトリ → Settings → Secrets and variables → Actions）
#   APPLE_TEAM_ID     Apple Developer → Membership details の Team ID（10桁）
#   ASC_KEY_ID        App Store Connect → ユーザとアクセス → 統合 → App Store Connect API → キーを生成（役割：Admin か App Manager）
#   ASC_ISSUER_ID     同じ画面の Issuer ID
#   ASC_KEY_P8        ダウンロードした AuthKey_XXXX.p8 の中身をそのまま（-----BEGIN PRIVATE KEY----- から）
#
# 事前に App Store Connect → マイ App → 「+」で App を作っておく（バンドル ID：jp.trainingnotebook.app）。
# 署名（証明書・プロファイル）は Xcode のクラウド署名で自動作成される。
# Secrets が無いときは何もしないで終わる。
name: iOS TestFlight

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "terms.html"
      - "ios/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check secrets
        id: check
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Apple の Secrets（APPLE_TEAM_ID / ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8）が未設定なのでスキップしました"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Select Xcode
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode.app || true
          xcodebuild -version

      - name: Install & sync web assets into the iOS project
        if: steps.check.outputs.ready == 'true'
        run: |
          npm ci
          npm run ios:sync

      - name: Write App Store Connect API key
        if: steps.check.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Version numbers
        if: steps.check.outputs.ready == 'true'
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "MARKETING_VERSION=$VER" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "version $VER ($BUILD_NUMBER)"

      - name: Archive (cloud signing)
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build/archive.log | grep -E "error:|warning: (.*)signing|\*\* ARCHIVE" || true
          test -d build/App.xcarchive || { echo "アーカイブに失敗しました。build/archive.log を確認してください"; tail -80 build/archive.log; exit 1; }

      - name: Upload to TestFlight
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee build/export.log | grep -E "error:|Upload|EXPORT" || true
          grep -q "EXPORT SUCCEEDED" build/export.log || { tail -60 build/export.log; exit 1; }
          echo "### TestFlight にアップロードしました 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "- バージョン $MARKETING_VERSION ($BUILD_NUMBER)。App Store Connect → TestFlight で処理完了（10〜30分）後にテストできます" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep logs
        if: always() && steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: build/*.log
          if-no-files-found: ignore
