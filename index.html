<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0B0F16">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>training support</title>
<meta name="apple-mobile-web-app-title" content="training support">
<meta name="application-name" content="training support">
<style>
  :root{
    /* 続けたくなる配色：深い藍のベース＋炎のアクセント＋達成の緑 */
    --bg:#0B0F16;
    --surface:#141B25;
    --surface-2:#1E2733;
    --surface-3:#2B3644;
    --border:#506173;       /* 枠線（旧#374553は背景との比1.5で見えなかった） */
    --text:#F4F8FC;
    --muted:#B8C6D4;
    --muted-2:#94A5B8;
    --pri:#FFA83C;          /* 文字・アイコン用（背景との比 9.9） */
    --pri-fill:#FF922B;     /* 塗りボタン用（--on-priとの比 8.3） */
    --pri-press:#E07A16;
    --on-pri:#1A1206;       /* 塗りボタンの上に乗る文字色 */
    --pri-dim:rgba(255,168,60,.18);
    --green:#3DDC8B;
    --green-dim:rgba(61,220,139,.16);
    --red:#FF5C63;
    --red-dim:rgba(255,92,99,.14);
    --streak:#FF7A3D;
    --nav-h:64px;
    --timer-h:76px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
    --num:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.4;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}

  /* ---------- App shell ---------- */
  #app{min-height:100vh;min-height:100dvh;}
  .view{display:none;padding:calc(var(--safe-t) + 14px) 16px calc(var(--nav-h) + var(--safe-b) + 24px);}
  .view.active{display:block;}
  #view-train.active{padding-bottom:calc(var(--nav-h) + var(--timer-h) + var(--safe-b) + 16px);}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px;min-height:46px;}
  .topbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .topbar .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .topbar-right{display:flex;align-items:center;gap:12px;}

  /* ---------- Date nav ---------- */
  .datenav{display:flex;align-items:center;gap:8px;margin:0 0 16px;}
  .date-arrow{width:44px;height:44px;flex:0 0 44px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:22px;line-height:1;display:grid;place-items:center;}
  .date-arrow:active{background:var(--surface-3);}
  .date-arrow:disabled{opacity:.32;}
  .date-cur{flex:1;height:44px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}
  .date-cur:active{background:var(--surface-3);}
  .date-today{height:44px;padding:0 14px;border-radius:11px;background:var(--pri-dim);border:1px solid rgba(255,168,60,.4);color:var(--pri);font-size:13px;font-weight:800;}
  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .cal-nav{width:46px;height:46px;flex:0 0 46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:24px;line-height:1;display:grid;place-items:center;}
  .cal-nav:active{background:var(--surface-3);}
  .cal-nav:disabled{opacity:.3;}
  .cal-title{flex:1;height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .cal-title:active{background:var(--surface-3);}
  .cal-caret{font-size:11px;color:var(--pri);}
  .cal-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .cal-wd span{text-align:center;font-size:11px;font-weight:700;color:var(--muted-2);padding:4px 0;}
  .cal-wd span.sun{color:#E8737A;} .cal-wd span.sat{color:#6FA8FF;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:18px;}
  .cal-cell{position:relative;height:46px;border-radius:10px;background:transparent;color:var(--text);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;display:grid;place-items:center;}
  .cal-cell.empty{background:none;}
  .cal-cell:active{background:var(--surface-2);}
  .cal-cell.today{border:1px solid var(--pri);}
  .cal-cell.sel{background:var(--pri-fill);color:var(--on-pri);}
  .cal-cell.future{color:var(--muted-2);opacity:.5;}
  .cal-dot{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--green);}
  .cal-cell.sel .cal-dot{background:var(--on-pri);}
  .cal-years{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .cal-year{height:52px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
  .cal-year.active{background:var(--pri-fill);color:var(--on-pri);border-color:var(--pri);}

  /* ---------- Cardio / photo ---------- */
  .cardio-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cardio-lab{flex:0 0 84px;font-size:14px;font-weight:700;color:var(--muted);}
  .cardio-row .field{flex:1;}


  /* ---------- Add to home screen ---------- */
  .a2hs,.bkrem{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:45;
        background:var(--surface-3);border:1px solid var(--border);border-radius:14px;padding:14px 40px 14px 16px;
        box-shadow:0 8px 28px rgba(0,0,0,.5);opacity:0;transform:translateY(12px);pointer-events:none;
        transition:opacity .25s,transform .25s;}
  .a2hs.show,.bkrem.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .bkrem-go{width:100%;height:46px;margin-top:12px;border-radius:11px;
            background:var(--pri-fill);color:var(--on-pri);font-size:15px;font-weight:800;}
  .bkrem-go:active{background:var(--pri-press);}
  .a2hs-t{font-size:14px;font-weight:800;margin-bottom:6px;}
  .a2hs-b{font-size:12px;line-height:1.6;color:var(--muted);}
  .a2hs-b b{color:var(--text);}
  .a2hs-warn{color:var(--pri);}
  .a2hs-x{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;background:var(--surface-2);color:var(--muted);font-size:13px;display:grid;place-items:center;}

  /* ---------- 今日やったこと ---------- */
  .today-card{padding:14px 14px 8px;}
  .today-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;}
  .today-head .th-t{font-size:15px;font-weight:800;color:var(--text);}
  .today-sum{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:12px;font-variant-numeric:tabular-nums;}
  .today-empty{font-size:13px;color:var(--muted);line-height:1.6;padding:6px 0 12px;}
  .tdo{display:block;width:100%;text-align:left;padding:12px 12px;margin-bottom:8px;border-radius:12px;
       background:var(--surface-2);border:1px solid var(--border);}
  .tdo:active{background:var(--surface-3);}
  .tdo.now{border-color:var(--pri);background:var(--pri-dim);}
  .tdo-n{font-size:15px;font-weight:800;color:var(--text);line-height:1.3;}
  .tdo-d{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:13px;color:var(--muted);
         font-variant-numeric:tabular-nums;}
  .tdo-s b{color:var(--text);font-weight:700;}
  .tdo-m{margin-top:6px;font-size:11px;color:var(--muted);line-height:1.5;border-left:2px solid var(--border);
         padding-left:7px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

  /* ---------- メニュー ---------- */
  .mtabs{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px;}
  .mtab{flex:1;height:42px;border-radius:9px;font-size:14px;font-weight:800;color:var(--muted);}
  .mtab.active{background:var(--pri-fill);color:var(--on-pri);}
  .lv-chips{display:flex;gap:8px;margin-bottom:14px;}
  .lv-chip{flex:1;height:48px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
           color:var(--muted);font-size:15px;font-weight:800;}
  .lv-chip.active{background:var(--pri-dim);border-color:var(--pri);color:var(--pri);}
  .sp-chips{padding-bottom:14px;}
  .mn-head{padding:16px;}
  .mn-cond{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;line-height:1.6;}
  .mn-split{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .mn-sum{font-size:13px;line-height:1.8;color:var(--muted);margin-top:8px;}
  .mn-day{padding:14px;}
  .mn-day-h{display:flex;align-items:center;gap:9px;margin-bottom:4px;flex-wrap:wrap;}
  .mn-day-n{font-size:11px;font-weight:800;color:var(--on-pri);background:var(--pri-fill);border-radius:20px;padding:3px 10px;}
  .mn-day-t{font-size:16px;font-weight:800;}
  .mn-day-note{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;}
  .mn-ex{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;text-align:left;
         padding:11px 12px;margin-bottom:7px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);}
  .mn-ex:active{background:var(--surface-3);}
  .mn-ex.off{opacity:.6;}
  .mn-ex-l{flex:1;min-width:0;}
  .mn-ex-n{font-size:14px;font-weight:700;color:var(--text);line-height:1.4;}
  .mn-ex-x{font-size:10px;color:var(--muted-2);font-weight:600;}
  .mn-ex-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px;}
  .mn-ex-r{flex:0 0 auto;text-align:right;}
  .mn-sets{display:block;font-size:13px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .mn-rest{display:block;font-size:10px;color:var(--muted-2);margin-top:2px;white-space:nowrap;}
  .mn-adv-t{font-size:15px;font-weight:800;margin-bottom:10px;}
  .mn-p{font-size:13px;line-height:1.9;color:var(--muted);margin:0;}
  .adv-i{margin-bottom:12px;}
  .adv-i b{display:block;font-size:12px;color:var(--pri);font-weight:800;margin-bottom:3px;}
  .adv-i span{font-size:13px;line-height:1.8;color:var(--muted);}
  .mn-ul{margin:0 0 4px;padding-left:18px;}
  .mn-ul li{font-size:13px;line-height:1.8;color:var(--muted);margin-bottom:6px;}
  .faq-i{margin-bottom:14px;}
  .faq-i b{display:block;font-size:13px;color:var(--text);font-weight:800;margin-bottom:4px;}
  .faq-i span{font-size:13px;line-height:1.8;color:var(--muted);}

  .pick-sec{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.03em;margin:12px 2px 7px;}
  .my-no{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
         background:var(--pri-fill);color:var(--on-pri);font-size:11px;font-weight:800;margin-right:7px;
         vertical-align:middle;font-variant-numeric:tabular-nums;}

  /* ---------- 記録したときの動き ---------- */
  @keyframes fxPop{0%{transform:scale(1);}35%{transform:scale(1.05);}100%{transform:scale(1);}}
  .fx-pop{animation:fxPop .32s cubic-bezier(.34,1.56,.64,1);}
  @keyframes fxShine{
    0%{transform:scale(1);filter:brightness(1);}
    25%{transform:scale(1.07);filter:brightness(1.5);}
    55%{transform:scale(.99);filter:brightness(1.1);}
    100%{transform:scale(1);filter:brightness(1);}}
  .fx-shine{animation:fxShine .7s ease;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden;}
  .confetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;opacity:0;
              animation:fxFall 1.2s cubic-bezier(.3,.7,.5,1) forwards;}
  @keyframes fxFall{
    0%{opacity:0;transform:translateY(0) rotate(0deg);}
    12%{opacity:1;}
    100%{opacity:0;transform:translateY(70vh) rotate(520deg);}}
  /* 更新バッジを目立たせる */
  @keyframes prPulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.12);}}
  .pr-badge{animation:prPulse 1.1s ease-in-out 2;}
  @media (prefers-reduced-motion: reduce){
    .fx-pop,.fx-shine,.pr-badge{animation:none;}
    .confetti{display:none;}
  }

  /* ---------- 部位チップ・言語切替 ---------- */
  .part-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
  .part-chip{font-size:12px;font-weight:800;color:var(--pri);background:var(--pri-dim);
             border:1px solid rgba(255,168,60,.35);border-radius:20px;padding:4px 11px;}
  .lang-row{display:flex;gap:8px;margin-bottom:16px;}
  .lang-b{flex:1;height:50px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
          color:var(--muted);font-size:15px;font-weight:800;}
  .lang-b.active{background:var(--pri-dim);border-color:var(--pri);color:var(--pri);}
  .pk-mode{margin-bottom:12px;}
  .pk-mode .mtab{height:38px;font-size:13px;}

  /* ---------- タイマー終了の表示 ---------- */
  .t-done{position:fixed;left:10px;right:10px;top:calc(var(--safe-t) + 10px);z-index:80;
          display:none;align-items:center;gap:10px;padding:14px 12px 14px 16px;border-radius:16px;
          background:var(--pri-fill);color:var(--on-pri);box-shadow:0 10px 30px rgba(0,0,0,.55);
          animation:tdIn .22s ease;}
  .t-done.show{display:flex;}
  @keyframes tdIn{from{transform:translateY(-16px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .t-done .td-l{flex:1;min-width:0;}
  .t-done .td-t{font-size:19px;font-weight:800;letter-spacing:-.01em;}
  .t-done .td-s{font-size:12px;opacity:.75;margin-top:3px;}
  .td-btn{flex:0 0 54px;width:54px;height:54px;border-radius:14px;font-size:22px;line-height:1;
          display:grid;place-items:center;background:rgba(0,0,0,.16);color:var(--on-pri);}
  .td-btn:active{background:rgba(0,0,0,.3);}

  /* ---------- Store bar ---------- */
  .storebar{display:flex;margin-bottom:10px;}
  .store-btn{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:11px;background:var(--pri-dim);border:1px solid rgba(255,168,60,.4);color:var(--pri);font-size:15px;font-weight:800;max-width:100%;}
  .store-btn:active{background:var(--surface-3);}
  .store-btn .st-ico{font-size:14px;}
  .store-btn .st-caret{font-size:10px;}
  #store-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .store-list{margin-bottom:12px;}
  .store-row{display:flex;align-items:stretch;gap:8px;margin-bottom:8px;}
  .store-pick{flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:10px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;text-align:left;}
  .store-row.active .store-pick{border-color:var(--pri);background:var(--pri-dim);}
  .store-nm{font-size:16px;font-weight:800;}
  .store-n{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);}
  .store-row.active .store-n{color:var(--pri);}
  .store-ed{flex:0 0 46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:15px;}

  /* ---------- Search ---------- */
  .searchbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;}
  .searchbar .s-ico{font-size:15px;opacity:.65;flex:0 0 auto;}
  .searchbar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:16px;font-weight:600;padding:0;}
  .searchbar input::placeholder{color:var(--muted-2);font-weight:500;}
  .searchbar input::-webkit-search-cancel-button{display:none;}
  .s-clear{display:none;width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--surface-3);color:var(--text);font-size:15px;place-items:center;}
  .search-results{display:none;margin-bottom:14px;}
  .sr-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:56px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;text-align:left;}
  .sr-item:active{background:var(--surface-2);}
  .sr-item.active{border-color:var(--pri);background:var(--pri-dim);}
  .sr-name{font-size:16px;font-weight:700;line-height:1.3;}
  .sr-area{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:20px;padding:4px 10px;}
  .sr-item.active .sr-area{color:var(--pri);}
  .sr-empty{padding:22px 4px 14px;text-align:center;color:var(--muted);font-size:14px;}
  .sr-add{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--border);color:var(--pri);font-size:15px;font-weight:700;}

  /* 体重タブの微調整用（0.1kg刻みなので±のまま残している） */
  .stepper{width:46px;height:46px;flex:0 0 46px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--text);user-select:none;}
  .stepper:active{background:var(--pri-fill);color:var(--on-pri);}

  /* ---------- ヘッダーのボタン ---------- */
  .topbar-btns{display:flex;gap:8px;flex:0 0 auto;}
  .icon-btn:active{background:var(--surface-3);}

  /* ---------- 重量の入力（打ち込み＋微調整スライダー） ---------- */
  .kg-in-row{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:4px 0 14px;}
  .kg-in{width:60%;max-width:220px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
         padding:14px 10px;color:var(--text);font-size:40px;font-weight:800;text-align:center;
         font-variant-numeric:tabular-nums;outline:none;}
  .kg-in:focus{border-color:var(--pri);}
  .kg-in::-webkit-outer-spin-button,.kg-in::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .kg-in::placeholder{color:var(--muted-2);}
  .kg-in-u{font-size:16px;font-weight:700;color:var(--muted);}

  /* ---------- 数値ピッカー ---------- */
  .wheel-quick{display:flex;gap:8px;margin-bottom:14px;}
  .wheel-q{flex:1;height:52px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;}
  .wheel-q.now{background:var(--pri-dim);border-color:var(--pri);color:var(--pri);}
  .wheel-list{position:relative;max-height:min(44vh,340px);overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;
              -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);
              mask-image:linear-gradient(to bottom,transparent 0,#000 22px,#000 calc(100% - 22px),transparent 100%);}
  .wheel-item{display:flex;align-items:baseline;justify-content:center;gap:6px;width:100%;height:54px;background:transparent;border-bottom:1px solid var(--border);color:var(--text);}
  .wheel-item:active{background:var(--surface-2);}
  .wheel-item.active{background:var(--pri-dim);border-left:4px solid var(--pri);border-bottom-color:var(--pri);}
  .wheel-item .wv{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .wheel-item.active .wv{color:var(--pri);}
  .wheel-item.active .wu{color:var(--pri);}
  .wheel-item .wu{font-size:12px;color:var(--muted);}

  /* ---------- 履歴 ---------- */
  .hist-btn{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:10px;padding:11px 12px;border-radius:10px;background:var(--surface-3);color:var(--pri);font-size:14px;font-weight:700;}
  .hist-btn:active{background:var(--pri-dim);}
  .hist-btn .hb-c{font-size:16px;}
  .prev-ref .pset.top b{color:var(--pri);}
  .hist-best{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;text-align:center;}
  .hist-best .hb-l{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin-bottom:6px;}
  .hist-best .hb-v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;}
  .hist-best .hb-u{font-size:14px;color:var(--muted);font-weight:700;margin:0 2px;}
  .hist-best .hb-d{font-size:12px;color:var(--muted);margin-top:6px;}
  .hist-sum{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:700;color:var(--muted);margin:0 2px 10px;}
  .hs-d{font-variant-numeric:tabular-nums;}
  .hs-d.up{color:var(--green);} .hs-d.down{color:var(--muted);}
  .hist-chart{margin-bottom:20px;}
  .hbars{display:flex;align-items:flex-end;gap:5px;height:150px;}
  .hbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;}
  .hbar-v{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px;}
  .hbar-t{flex:1;width:100%;display:flex;align-items:flex-end;}
  .hbar-f{width:100%;background:var(--surface-3);border-radius:5px 5px 0 0;min-height:3px;}
  .hbar-f.now{background:var(--pri-fill);}
  .hbar-l{font-size:10px;color:var(--muted-2);margin-top:5px;}
  .hist-list{max-height:min(38vh,320px);overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:14px;}
  .hrow{padding:12px 2px;border-bottom:1px solid var(--border);}
  .hrow:last-child{border-bottom:none;}
  .hrow-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
  .hrow-d{font-size:13px;font-weight:700;color:var(--text);}
  .hrow-m{font-size:12px;color:var(--pri);font-weight:700;font-variant-numeric:tabular-nums;}
  .hrow .sets{display:flex;flex-wrap:wrap;gap:5px 9px;}
  .hrow .pset{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .hrow .pset b{color:var(--text);font-weight:700;}
  .hrow-memo{margin-top:7px;font-size:12px;color:var(--muted);line-height:1.5;border-left:2px solid var(--border);padding-left:8px;white-space:pre-wrap;}

  /* ---------- Backup ---------- */
  .bk-btns{display:flex;gap:10px;margin-bottom:12px;}
  .bk-btns .btn{height:50px;font-size:15px;}

  /* ---------- Memo ---------- */
  .memo-input{width:100%;min-height:56px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:15px;line-height:1.6;outline:none;resize:none;overflow:hidden;}
  .memo-input:focus{border-color:var(--pri);}
  .memo-input::placeholder{color:var(--muted-2);}
  .memo-prev{margin-top:14px;padding:12px 14px;background:var(--surface-2);border-left:3px solid var(--pri);border-radius:0 12px 12px 0;}
  .memo-prev-l{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .memo-prev-t{font-size:14px;line-height:1.6;color:var(--text);white-space:pre-wrap;}

  /* ---------- Exercise selector ---------- */
  .ex-select{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:10px 16px;margin-bottom:14px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;text-align:left;}
  .ex-select:active{background:var(--surface-3);}
  .es-l{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .es-area{font-size:11px;font-weight:700;color:var(--pri);letter-spacing:.03em;}
  .es-name{font-size:19px;font-weight:800;color:var(--text);line-height:1.25;}
  .es-caret{flex:0 0 auto;font-size:13px;color:var(--muted);}

  /* ---------- Exercise picker (縦スクロール) ---------- */
  .picker-list{max-height:min(46vh,380px);overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;padding-right:2px;}
  .pick-item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:58px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;text-align:left;}
  .pick-item:active{background:var(--surface-3);}
  .pick-item.active{border-color:var(--pri);background:var(--pri-dim);}
  .pick-name{font-size:16px;font-weight:700;line-height:1.35;color:var(--text);}
  .pick-dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--green);}

  /* ---------- Area tabs ---------- */
  .area-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none;}
  .area-tabs::-webkit-scrollbar{display:none;}
  .area-tab{flex:0 0 auto;padding:9px 13px;border-radius:10px;background:transparent;color:var(--muted);font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:6px;border:1px solid var(--border);}
  .area-tab.active{background:var(--surface-2);color:var(--text);border-color:var(--surface-3);}
  .area-tab .area-n{font-size:11px;font-weight:700;color:var(--muted-2);background:var(--surface-3);border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums;}
  .area-tab.active .area-n{color:var(--pri);background:var(--pri-dim);}

  /* ---------- Exercise chips ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;padding:11px 16px;border-radius:12px;background:var(--surface-2);
    color:var(--muted);font-size:15px;font-weight:600;white-space:nowrap;border:1px solid transparent;
    transition:background .12s,color .12s,border-color .12s;
  }
  .chip.active{background:var(--pri-dim);color:var(--pri);border-color:rgba(255,168,60,.45);}
  .chip.add{color:var(--pri);background:transparent;border:1px dashed var(--border);width:46px;padding:11px 0;text-align:center;font-size:20px;line-height:1;}

  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;}
  .ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .ex-head .name{font-size:20px;font-weight:800;letter-spacing:-.01em;}
  .ex-head .tools{display:flex;gap:6px;}
  .icon-btn{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);font-size:19px;}
  .icon-btn:active{background:var(--surface-3);}

  .prev-ref{margin:14px 0 8px;padding:12px 14px;background:var(--surface-2);border-radius:12px;}
  .prev-ref .label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin-bottom:8px;display:flex;justify-content:space-between;}
  .prev-ref .sets{display:flex;flex-wrap:wrap;gap:6px 10px;}
  .prev-ref .pset{font-size:16px;color:#C6CBD2;font-variant-numeric:tabular-nums;}
  .prev-ref .pset b{color:var(--text);font-weight:700;}
  .prev-empty{font-size:14px;color:var(--muted-2);}

  .today-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin:16px 2px 10px;}

  /* ---------- Set row ---------- */
  .set{display:flex;align-items:stretch;gap:6px;margin-bottom:10px;}
  .set-idx{flex:0 0 20px;display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted-2);font-variant-numeric:tabular-nums;}
  /* 数字はタップで一覧を開く（±ボタンは廃止） */
  .field{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;min-height:76px;text-align:center;}
  .field:active{background:var(--surface-3);border-color:var(--pri);}
  .field .valrow{display:flex;align-items:baseline;justify-content:center;gap:3px;min-width:0;width:100%;}
  .field .val{min-width:0;color:var(--text);font-size:clamp(26px,8vw,34px);line-height:1.1;font-weight:800;
              font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap;}
  .field .val.d4{font-size:clamp(22px,6.2vw,28px);}
  .field .val.d5{font-size:clamp(19px,5.2vw,24px);}
  .field .val.ph{color:var(--muted-2);}
  .field .unit{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted);}
  .field-hint{font-size:10px;color:var(--muted-2);font-weight:600;}
  .set-del{flex:0 0 44px;align-self:stretch;min-height:44px;display:grid;place-items:center;
           border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
           color:var(--muted);font-size:20px;line-height:1;}
  .set-del:active{background:var(--red-dim);border-color:var(--red);color:var(--red);}

  /* 画面の狭い端末では余白を詰めて数字の幅を確保する */
  @media (max-width:360px){
    .view{padding-left:12px;padding-right:12px;}
    .card{padding:12px;}
    .field{padding:6px;}
    .field{min-height:70px;padding:8px 6px 6px;}
    .field .unit{font-size:11px;}
    .field .val{font-size:clamp(24px,7.4vw,30px);}
    .set-idx{flex:0 0 16px;}
    .set-del{flex:0 0 40px;}
  }

  .set.pr .field{border-color:rgba(53,208,127,.5);background:var(--green-dim);}
  .pr-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--green);color:#062713;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.4);}

  .set-cmp{flex-basis:100%;font-size:11px;color:var(--muted-2);padding-left:34px;margin:-4px 0 4px;font-variant-numeric:tabular-nums;}

  .add-set{width:100%;height:52px;border-radius:12px;background:var(--surface-2);border:1px dashed var(--border);color:var(--pri);font-size:15px;font-weight:700;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .add-set:active{background:var(--pri-dim);}

  .empty-ex{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-ex .big{font-size:40px;margin-bottom:12px;opacity:.5;}

  /* ---------- Timer bar ---------- */
  #timerbar{
    position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));
    height:var(--timer-h);background:rgba(23,26,31,.92);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);
    display:none;align-items:center;gap:10px;padding:0 14px;z-index:30;
  }
  #timerbar.show{display:flex;}
  .t-display{flex:0 0 auto;display:flex;flex-direction:column;min-width:78px;}
  .t-time{font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;color:#FFFFFF;}
  .t-time.soon{color:#FFC24D;}      /* 残りわずか */
  .t-time.done{color:var(--green);}
  .t-time.idle{color:var(--muted);}
  .t-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.05em;margin-top:3px;}
  .t-presets{flex:1;display:flex;gap:7px;}
  .t-preset{flex:1;height:48px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text);}
  .t-preset:active{background:var(--pri-fill);color:var(--on-pri);}
  .t-custom{flex:0 0 44px;font-size:20px;color:var(--pri);}
  .t-stop{flex:0 0 48px;height:48px;border-radius:11px;background:var(--red-dim);color:var(--red);font-size:20px;display:grid;place-items:center;}
  .t-progress{position:absolute;top:-1px;left:0;height:2px;background:var(--pri);width:0;transition:width .25s linear;}


  /* ---------- Weight tab ---------- */
  .w-entry{display:flex;gap:10px;align-items:stretch;margin-bottom:6px;}
  .w-field{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:6px;display:flex;align-items:center;gap:2px;position:relative;}
  .w-field .val{flex:1;text-align:center;background:none;border:none;outline:none;color:var(--text);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;width:100%;}
  .w-field .val::placeholder{color:var(--muted-2);}
  .w-field .unit{position:absolute;right:54px;bottom:8px;font-size:11px;color:var(--muted-2);}
  .w-save{flex:0 0 84px;border-radius:12px;background:var(--pri-fill);color:var(--on-pri);font-size:16px;font-weight:800;}
  .w-save:active{background:var(--pri-press);}
  .w-save.done{background:var(--green);color:#062713;}
  .w-date{font-size:12px;color:var(--muted);margin:2px 2px 14px;}
  .w-datepick{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .w-datepick .w-date{margin:0;font-size:14px;color:var(--text);font-weight:700;}
  .w-datebtn{font-size:12px;font-weight:700;color:var(--pri);padding:6px 10px;border-radius:8px;background:var(--pri-dim);}

  /* ---------- Goal ---------- */
  .goal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:34px;}
  .goal-set{color:var(--pri);font-size:14px;font-weight:700;}
  .goal-info{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .goal-k{font-size:12px;color:var(--muted);font-weight:600;}
  .goal-v{font-size:18px;font-weight:800;}
  .goal-remain{font-size:12px;color:var(--muted);font-weight:700;}
  .goal-remain.hit{color:var(--green);}
  .goal-edit{width:34px;height:34px;border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:14px;display:grid;place-items:center;}

  /* ---------- Chart mode toggle ---------- */
  .wmode{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:4px;margin-bottom:16px;}
  .wmode-btn{flex:1;height:38px;border-radius:8px;font-size:14px;font-weight:800;color:var(--muted);}
  .wmode-btn.active{background:var(--pri-fill);color:var(--on-pri);}

  .chart-wrap{position:relative;width:100%;}
  .chart-stats{display:flex;gap:18px;margin-bottom:12px;}
  .stat .k{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em;}
  .stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;}
  .stat .v.up{color:var(--green);}
  .stat .v.down{color:var(--pri);}
  svg.chart{width:100%;height:180px;display:block;overflow:visible;}
  .chart-empty{padding:40px 10px;text-align:center;color:var(--muted-2);font-size:14px;}

  .w-list{margin-top:4px;}
  .w-row{display:flex;justify-content:space-between;align-items:center;padding:13px 4px;border-bottom:1px solid var(--border);}
  .w-row:last-child{border-bottom:none;}
  .w-row .d{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .w-row .kg{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .w-row .diff{font-size:12px;font-weight:700;margin-left:8px;font-variant-numeric:tabular-nums;}
  .w-row .diff.up{color:var(--green);}
  .w-row .diff.down{color:var(--muted);}
  .w-row .del{color:var(--muted-2);font-size:16px;padding:4px 8px;}

  /* ---------- Bottom nav ---------- */
  #nav{
    position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));
    padding-bottom:var(--safe-b);background:rgba(11,15,22,.94);backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);
    display:flex;z-index:40;
  }
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted-2);font-size:11px;font-weight:600;}
  .nav-item .ni{font-size:22px;line-height:1;}
  .nav-item.active{color:var(--pri);}

  /* ---------- Modal / sheet ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:70;display:none;
            overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
  /* 下から出るシートなので、中身は必ず画面の下端に寄せる
     （flex-endが無いと上端に張りついて、時計や電波表示に重なってしまう） */
  .backdrop.show{display:flex;flex-direction:column;justify-content:flex-end;}
  .sheet{width:100%;background:var(--surface);border-radius:20px 20px 0 0;
         /* 上下の余白は、貼りつく見出し／ボタン側が持つ（stickyの位置がずれないように） */
         padding:0 18px;border-top:1px solid var(--border);
         animation:up .22s ease;
         /* 画面より高くならないようにして、上部が切れるのを防ぐ */
         max-height:calc(100dvh - var(--safe-t) - 12px);
         display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .sheet > *{flex:0 0 auto;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  /* 見出しは上に、ボタンは下に貼りつけて、長い一覧でも操作先を見失わないようにする */
  .sheet h2{position:sticky;top:0;z-index:3;background:var(--surface);
            border-radius:20px 20px 0 0;
            margin:0 -18px;padding:22px 18px 16px;
            font-size:18px;font-weight:800;}
  .sheet > *:first-child:not(h2){margin-top:22px;}
  .sheet input.text{width:100%;height:54px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:0 16px;font-size:17px;color:var(--text);outline:none;margin-bottom:14px;}
  .sheet input.text:focus{border-color:var(--pri);}
  .sheet-btns{display:flex;gap:10px;position:sticky;bottom:0;z-index:3;
              background:var(--surface);margin:0 -18px;padding:12px 18px calc(22px + var(--safe-b));}
  .sheet-btns:not(:last-child){padding-bottom:12px;}
  .btn{flex:1;height:58px;border-radius:12px;font-size:17px;font-weight:800;}
  .btn.primary{flex:1.4;background:var(--pri-fill);color:var(--on-pri);}
  .btn.primary:active{background:var(--pri-press);}
  .btn.ghost{background:var(--surface-2);color:var(--text);}
  .btn.danger{background:var(--red-dim);color:var(--red);}
  /* 設定のトグル行 */
  .set-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
  .set-row .txt{flex:1;min-width:0;}
  .set-row .txt b{display:block;font-size:15px;font-weight:700;}
  .set-row .txt span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
  .sw{flex:0 0 52px;width:52px;height:31px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .15s;cursor:pointer;}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .15s;}
  .sw.on{background:var(--pri);}
  .sw.on::after{transform:translateX(21px);}
  .sheet .del-link{display:block;text-align:center;margin-top:10px;padding-bottom:calc(18px + var(--safe-b));
                   color:var(--red);font-size:14px;font-weight:600;}
  .pill-label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em;margin:0 2px 8px;}
  .area-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .area-pill{padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);font-size:14px;font-weight:700;}
  .area-pill.active{background:var(--pri-dim);color:var(--pri);border-color:rgba(255,168,60,.45);}

  .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);transform:translateX(-50%);background:var(--surface-3);color:var(--text);padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;z-index:78;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;border:1px solid var(--border);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  /* ---------- カレンダーの部位表示 ---------- */
  .cal-parts{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);display:flex;gap:2px;}
  .cal-parts i{display:block;width:5px;height:5px;border-radius:2px;}
  .cal-cell.sel .cal-parts i{outline:1px solid rgba(0,0,0,.45);}
  .cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 16px;}
  .cal-legend span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);}
  .cal-legend i{width:9px;height:9px;border-radius:3px;}
  .cal-sum{font-size:12px;color:var(--muted);margin:-6px 0 14px;text-align:center;}
  .cal-sum b{color:var(--pri);}

  /* ---------- 連続記録（続けるための動機づけ） ---------- */
  .streak{display:flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:999px;
          background:rgba(255,122,61,.16);border:1px solid rgba(255,122,61,.35);
          color:var(--streak);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .streak.zero{background:var(--surface-2);border-color:var(--border);color:var(--muted);}

  /* ---------- 部位チップ ---------- */
  .pchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;}
  .pchip{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
         background:var(--surface-2);border:1px solid var(--border);font-size:11px;font-weight:800;}
  .pchip i{width:8px;height:8px;border-radius:3px;}

  /* ---------- プラン ---------- */
  .plan-card{border:1px solid var(--border);background:var(--surface-2);border-radius:14px;padding:14px;margin-bottom:10px;}
  .plan-card.cur{border-color:var(--pri);background:var(--pri-dim);}
  .plan-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .plan-nm{font-size:16px;font-weight:800;}
  .plan-pr{font-size:15px;font-weight:800;color:var(--pri);font-variant-numeric:tabular-nums;}
  .plan-ft{font-size:12px;color:var(--muted);line-height:1.7;}
  .plan-ft b{color:var(--text);}
  .plan-badge{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:6px;background:var(--pri-fill);color:var(--on-pri);font-size:10px;font-weight:800;vertical-align:middle;}
  .plan-buy{width:100%;height:46px;margin-top:10px;border-radius:11px;background:var(--pri-fill);color:var(--on-pri);font-size:14px;font-weight:800;}
  .plan-buy:active{background:var(--pri-press);}
  .plan-buy.ghost{background:var(--surface-3);color:var(--text);}

  /* ---------- アカウント ---------- */
  .auth-btns{display:flex;gap:8px;margin-bottom:10px;}
  .auth-btns .auth-b{flex:1;min-width:0;}
  .ver-tag{font-size:11px;font-weight:700;color:var(--muted-2);}
  .auth-b{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:12px;
          font-size:15px;font-weight:800;border:1px solid var(--border);background:var(--surface-2);color:var(--text);}
  .auth-b:active{background:var(--surface-3);}
  .auth-b .ab-i{font-size:17px;font-weight:900;}
  .acc-row{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--border);
           border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .acc-av{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:var(--pri-fill);color:var(--on-pri);
          display:grid;place-items:center;font-size:17px;font-weight:800;}
  .acc-tx{flex:1;min-width:0;}
  .acc-tx b{display:block;font-size:15px;font-weight:800;}
  .acc-tx span{display:block;font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- AI相談 ---------- */
  #view-ai.active{display:flex;flex-direction:column;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 84px);}
  .ai-log{flex:1;display:flex;flex-direction:column;gap:10px;}
  .ai-msg{max-width:88%;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .ai-msg.me{align-self:flex-end;background:var(--pri-fill);color:var(--on-pri);border-bottom-right-radius:5px;}
  .ai-msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px;}
  .ai-msg.sys{align-self:center;max-width:100%;background:var(--surface-2);border:1px dashed var(--border);color:var(--muted);font-size:12px;}
  .ai-sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .ai-sug button{padding:9px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
                 color:var(--text);font-size:12px;font-weight:700;}
  .ai-bar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:38;
          display:flex;gap:8px;padding:10px 12px calc(10px);background:rgba(11,15,22,.96);
          backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);}
  .ai-bar input{flex:1;height:48px;padding:0 14px;border-radius:12px;background:var(--surface-2);
                border:1px solid var(--border);color:var(--text);font-size:15px;outline:none;}
  .ai-bar input:focus{border-color:var(--pri);}
  .ai-send{flex:0 0 74px;height:48px;border-radius:12px;background:var(--pri-fill);color:var(--on-pri);font-size:14px;font-weight:800;}
  .ai-send:disabled{opacity:.5;}
  .ai-quota{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .ai-quota b{color:var(--pri);}
</style>
</head>
<body>
<div id="app">

  <!-- ============ TRAINING ============ -->
  <section id="view-train" class="view active">
    <div class="topbar">
      <h1>トレーニング</h1>
      <div class="topbar-btns">
        <span class="streak" id="streak"></span>
        <button class="icon-btn" id="settings-btn" title="設定">⚙</button>
      </div>
    </div>
    <div class="datenav">
      <button class="date-arrow" id="date-prev">‹</button>
      <button class="date-cur" id="date-cur"><span id="train-date"></span></button>
      <button class="date-arrow" id="date-next">›</button>
      <button class="date-today" id="date-today">今日へ</button>
    </div>
    <div class="storebar" id="clientbar" style="display:none">
      <button class="store-btn" id="client-btn"><span class="st-ico">👤</span><span id="client-name">自分</span><span class="st-caret">▾</span></button>
    </div>
    <div class="searchbar">
      <span class="s-ico">🔍</span>
      <input id="ex-search" type="text" inputmode="search" autocomplete="off" placeholder="種目を検索（例: べんち / らっと）">
      <button class="s-clear" id="s-clear">✕</button>
    </div>
    <div class="search-results" id="search-results"></div>
    <button class="ex-select" id="ex-select">
      <span class="es-l"><span class="es-area" id="es-area"></span><span class="es-name" id="es-name">種目を選ぶ</span></span>
      <span class="es-caret">▾</span>
    </button>
    <div id="train-body"></div>
  </section>

  <!-- ============ MENU ============ -->
  <section id="view-menu" class="view">
    <div class="topbar"><h1>メニュー</h1></div>
    <div class="mtabs" id="mtabs"></div>
    <div id="menu-body"></div>
  </section>

  <!-- ============ AI ============ -->
  <section id="view-ai" class="view">
    <div class="topbar">
      <h1>AI相談</h1>
      <span class="ai-quota" id="ai-quota"></span>
    </div>
    <div class="ai-log" id="ai-log"></div>
    <div class="ai-sug" id="ai-sug"></div>
    <div class="ai-bar" id="ai-bar">
      <input id="ai-in" type="text" autocomplete="off" placeholder="トレーニングの相談を書く">
      <button class="ai-send" id="ai-send">送信</button>
    </div>
  </section>

  <!-- ============ WEIGHT ============ -->
  <section id="view-weight" class="view">
    <div class="topbar">
      <h1>体重</h1>
      <span class="sub" id="weight-date"></span>
    </div>

    <div class="card">
      <div class="w-datepick">
        <span class="w-date" id="w-entry-label">今朝の体重</span>
        <button class="w-datebtn" id="w-datebtn">日付を変更</button>
      </div>
      <div class="w-entry">
        <div class="w-field">
          <div class="stepper" data-w="-0.1">−</div>
          <input class="val num" id="w-input" type="number" inputmode="decimal" step="0.1" placeholder="––.–">
          <span class="unit">kg</span>
          <div class="stepper" data-w="0.1">＋</div>
        </div>
        <button class="w-save" id="w-save">記録</button>
      </div>
    </div>

    <div class="card">
      <div class="goal-row" id="goal-row"></div>
      <div class="wmode" id="wmode">
        <button class="wmode-btn" data-mode="day">日</button>
        <button class="wmode-btn" data-mode="week">週</button>
        <button class="wmode-btn" data-mode="month">月</button>
      </div>
      <div class="chart-stats" id="w-stats"></div>
      <div class="chart-wrap" id="w-chart"></div>
    </div>

    <div class="card">
      <div class="w-list" id="w-list"></div>
    </div>
  </section>

  <!-- ============ TIMER BAR ============ -->
  <div id="timerbar">
    <div class="t-progress" id="t-progress"></div>
    <div class="t-display" id="t-display">
      <span class="t-time idle" id="t-time">休憩</span>
      <span class="t-label" id="t-label">インターバル</span>
    </div>
    <div class="t-presets">
      <button class="t-preset" data-sec="60">1:00</button>
      <button class="t-preset" data-sec="120">2:00</button>
      <button class="t-preset" data-sec="180">3:00</button>
      <button class="t-preset t-custom" id="t-custom-btn">⋯</button>
    </div>
    <button class="t-stop" id="t-stop">■</button>
  </div>

  <!-- ============ NAV ============ -->
  <nav id="nav">
    <button class="nav-item active" data-tab="train"><span class="ni">▦</span>トレーニング</button>
    <button class="nav-item" data-tab="menu"><span class="ni">✦</span>メニュー</button>
    <button class="nav-item" data-tab="ai"><span class="ni">✧</span>AI相談</button>
    <button class="nav-item" data-tab="weight"><span class="ni">◔</span>体重</button>
  </nav>

  <!-- ============ SHEET ============ -->
  <div class="backdrop" id="backdrop">
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="t-done" id="t-done">
    <div class="td-l">
      <div class="td-t">インターバル終了</div>
      <div class="td-s" id="td-sub"></div>
    </div>
    <button class="td-btn again" id="td-again" title="同じ時間でもう一度">🔁</button>
    <button class="td-btn close" id="td-close" title="閉じる">✕</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="bkrem" id="bkrem">
    <button class="a2hs-x" id="bkrem-x">✕</button>
    <div class="a2hs-t">記録の控えを取りませんか</div>
    <div class="a2hs-b" id="bkrem-b"></div>
    <button class="bkrem-go" id="bkrem-go">いま書き出す</button>
  </div>

  <div class="a2hs" id="a2hs">
    <button class="a2hs-x" id="a2hs-x">✕</button>
    <div class="a2hs-t">ホーム画面に追加すると便利です</div>
    <div class="a2hs-b" id="a2hs-steps"></div>
  </div>

</div>

<script>
"use strict";
/* ============================================================
   トレーニングノート — 骨組み v1

const DB_KEY = "gymlog.v1";

function carryWeightOn(){ return state.ui.carryWeight !== false; }
/* タイマー音の鳴らし方。既定は music を止めない「transient（他の音に重ねる）」 */
function alarmSolo(){ return state.ui.alarmSolo === true; }
const REPS_STEP = 1;
/* 事前に用意したメニューデータ（通信も費用も発生しない） */
const MENU_DATA = {"version":"1.0","updated":"2026-08-06","note":"アプリに直接埋め込んで使う静的メニューデータ。exercises の name は店舗の設備名に合わせてあり、alt は同じ目的で代用できる種目（その店舗に name が無い場合に使う）。","disclaimer":"掲載の回数・重量・頻度は一般的な目安です。痛みや違和感が出たら中止してください。持病のある方、妊娠中の方、術後の方は必ず医師に相談のうえ行ってください。","common":{"warmup":{"label":"ウォームアップ（毎回共通・5〜10分）","steps":[{"name":"トレッドミル","alt":["クロストレーナー","リカンベントバイク","アップライトバイク"],"detail":"5分・軽く息が弾む程度","tip":"心拍を上げて関節を温める。息が切れるほどやらない。"},{"detail":"肩・股関節を大きく10回ずつ回す","tip":"動かす関節をひと通り動かしてから重りを持つ。"},{"detail":"その日の1種目目を、軽い重量で10回×1〜2セット","tip":"本番の半分くらいの重さでフォームを確認する。この分はセット数に数えない。"}]},"cooldown":{"label":"クールダウン（毎回共通・5分）","steps":[{"detail":"使った部位を20〜30秒ずつ伸ばす","tip":"反動をつけず、痛気持ちいいところで止める。"},{"name":"トレッドミル","alt":["リカンベントバイク"],"detail":"3〜5分・ゆっくり歩く","tip":"心拍を落ち着かせてから終わる。"}]},"howto_weight":{"label":"重量の決め方","text":"指定の回数を「あと1〜2回できそう」で終えられる重さを選びます。最後まで余裕なら重すぎではなく軽すぎ、指定回数に届かないなら重すぎです。まずは軽めから始めて、フォームが崩れない範囲で上げていきます。"},"howto_progress":{"label":"伸ばし方（漸進性過負荷）","text":"同じ重量で指定回数の上限を全セットこなせたら、次回は重量を2.5〜5kg上げて回数を下限に戻します。これを繰り返すのが最短の伸ばし方です。アプリの「前回の記録」と「更新！」表示を目安にしてください。"}},"levels":[{"id":"beginner","label":"初心者","criteria":"筋トレを始めて半年未満／フォームを覚えている段階","summary":"まずは全身をまんべんなく、マシン中心で。回数は多め・重量は軽めにして、正しい動きを体に覚えさせる時期です。","principles":["マシン中心にする。動く方向が決まっているのでフォームが崩れにくい。","1回のトレーニングで全身を回す（分割しない）。頻度が少なくても各部位を週2回鍛えられる。","1部位1〜2種目、2〜3セットで十分。やりすぎより続けることを優先する。","回数は10〜15回。軽めの重量で動きの質を上げる時期。","週2〜3回、間に必ず1日以上あける。"],"advice":{"progression":"最初の1〜2か月は重量を追わず、フォームと習慣づくりに集中してください。10〜15回を余裕を持ってこなせるようになったら2.5kgずつ上げます。","rest":"セット間は60〜90秒。息が整い、次のセットで同じ回数がこなせる程度が目安です。","form":"上げる動作より下ろす動作をゆっくり（2〜3秒）行うと効き方が変わります。反動を使わない、可動域を最後まで使う、この2つだけ意識してください。","frequency":"週2回でも効果は出ます。週3回にすると伸びが早くなりますが、続かなければ意味がないので生活に合う頻度を選んでください。","cardio":"筋トレの後に15〜20分。先にやると重量が落ちます。","mindset":"最初の1か月は筋肉より「神経が慣れる」時期で、重量が伸びやすい期間です。記録が伸びなくても通えていれば順調です。"},"cautions":["痛み（筋肉痛ではなく関節の痛み）が出たらその種目は中止する。","毎回オールアウト（限界まで追い込む）しない。翌々日まで残る筋肉痛は多すぎのサイン。","他人と重量を比べない。フォームが崩れた重量は記録にならない。"],"splits":[{"days":2,"name":"全身法（週2回）","summary":"1回で全身を回します。週2回でも各部位を週2回刺激できるので、始めたばかりの人に最も効率的です。","sessions":[{"title":"全身A","focus":["胸","背中","脚","体幹"],"note":"押す・引く・脚の基本3方向をひと通り。","exercises":[{"name":"レッグプレス","alt":["PLリニアレッグプレス"],"sets":3,"reps":"12〜15回","rest":"90秒","tip":"膝がつま先の方向に曲がるように。伸ばしきってロックしない。"},{"name":"チェストプレス","alt":["PLアイソラテラル・インクラインプレス"],"sets":3,"reps":"10〜12回","rest":"90秒","tip":"肩がすくまないよう胸を張り、肩甲骨を寄せたまま押す。"},{"name":"ラットプルダウン(MAG7種あり)","alt":["PLアイソラテラルフロントラッドプルダウン"],"sets":3,"reps":"10〜12回","rest":"90秒","tip":"腕で引かず、肘を体の横に落とす意識。鎖骨に向かって引く。"},{"name":"レッグカール","alt":["レッグカール（ライング）"],"sets":2,"reps":"12〜15回","rest":"60秒","tip":"戻すときにゆっくり。もも裏を伸ばしきる。"},{"name":"MTSアブドミナル","alt":["アブドミナル","B＆R レッグレイズ"],"sets":2,"reps":"12〜15回","rest":"60秒","tip":"勢いで曲げず、みぞおちを丸める意識。"}]},{"title":"全身B","focus":["脚","肩","背中","体幹"],"note":"Aと違う角度から同じ部位を刺激します。","exercises":[{"name":"レッグエクステンション","sets":3,"reps":"12〜15回","rest":"90秒","tip":"伸ばしきったところで1秒止めると効きが増す。"},{"name":"ショルダープレス","alt":["PLアイソラテラル・ショルダープレス"],"sets":3,"reps":"10〜12回","rest":"90秒","tip":"腰を反らせない。真上に押し上げる。"},{"name":"シーテッドロー","alt":["PLアイソラテラル・DYロー","PL Tバーロー"],"sets":3,"reps":"10〜12回","rest":"90秒","tip":"背中を丸めず、肩甲骨を寄せてから引く。"},{"name":"フライ/リアデルトイド","sets":2,"reps":"12〜15回","rest":"60秒","tip":"胸を開く動きと肩の後ろ、両方の設定で使える。まずは胸から。"},{"name":"B＆R 45度 バックエクステンション","sets":2,"reps":"12〜15回","rest":"60秒","tip":"反らせすぎない。背中が一直線になるところまで。"}]}]},{"days":3,"name":"全身法（週3回・A/B/A）","summary":"上の全身A・Bを交互に週3回。週2回より伸びが早く、初心者に最もおすすめの頻度です。","sessions":[{"title":"全身A","focus":["胸","背中","脚","体幹"],"note":"週2回版の全身Aと同じ内容。","exercises":[{"name":"レッグプレス","alt":["PLリニアレッグプレス"],"sets":3,"reps":"12〜15回","rest":"90秒","tip":"足の位置を肩幅に。かかとで押す。"},{"name":"チェストプレス","sets":3,"reps":"10〜12回","rest":"90秒","tip":"下ろす位置は乳頭のライン。深く下ろしすぎない。"},{"name":"ラットプルダウン(MAG7種あり)","sets":3,"reps":"10〜12回","rest":"90秒","tip":"体を少しだけ後傾させて胸を張る。"},{"name":"レッグカール","sets":2,"reps":"12〜15回","rest":"60秒","tip":"反動を使わない。"},{"name":"MTSアブドミナル","alt":["アブドミナル"],"sets":2,"reps":"12〜15回","rest":"60秒","tip":"呼吸を止めない。"}]},{"title":"全身B","focus":["脚","肩","背中","体幹"],"note":"週2回版の全身Bと同じ内容。","exercises":[{"name":"レッグエクステンション","sets":3,"reps":"12〜15回","rest":"90秒","tip":"座面の角度を合わせ、膝の位置を回転軸に。"},{"name":"ショルダープレス","sets":3,"reps":"10〜12回","rest":"90秒","tip":"肘を張りすぎず、やや前めに。"},{"name":"シーテッドロー","sets":3,"reps":"10〜12回","rest":"90秒","tip":"みぞおちに向かって引く。"},{"name":"PLラテラルレイズ","alt":["ダンベル"],"sets":2,"reps":"12〜15回","rest":"60秒","tip":"小指side を少し上げる意識。軽くて構わない。"},{"name":"B＆R レッグレイズ","alt":["B＆R アジャスタブルデクライン/アブドミナルベンチ"],"sets":2,"reps":"10〜15回","rest":"60秒","tip":"腰が反らないよう骨盤を丸めてから上げる。"}]},{"title":"全身C（仕上げ）","focus":["全身","有酸素"],"note":"3回目は少し軽めにして、苦手な部位と体幹を補います。","exercises":[{"name":"スミスマシン","alt":["PLハックスクワット"],"sets":3,"reps":"10〜12回","rest":"90秒","tip":"スクワット。軌道が固定されているのでフォームを覚えやすい。"},{"name":"チェストプレス","sets":2,"reps":"12〜15回","rest":"60秒","tip":"軽めにして可動域を大きく。"},{"name":"シーテッドロー","sets":2,"reps":"12〜15回","rest":"60秒","tip":"軽めにして肩甲骨の動きを確認。"},{"name":"ヒップアブダクション/アダクション","sets":2,"reps":"15回","rest":"45秒","tip":"お尻の横に効かせる。骨盤を立てて座る。"},{"name":"トレッドミル","alt":["クロストレーナー"],"sets":1,"reps":"15〜20分","rest":"—","tip":"会話できる程度の強度で。"}]}]},{"days":4,"name":"上下2分割（週4回）","summary":"慣れてきて週4回通えるなら、上半身と下半身に分けて1回あたりの種目数を増やします。上→下→休→上→下 の流れ。","sessions":[{"title":"上半身","focus":["胸","背中","肩","腕"],"note":"押す種目と引く種目を交互に入れて疲労を分散します。","exercises":[{"name":"チェストプレス","sets":3,"reps":"10〜12回","rest":"90秒","tip":"肩甲骨を寄せたまま。"},{"name":"ラットプルダウン(MAG7種あり)","sets":3,"reps":"10〜12回","rest":"90秒","tip":"背中で引く感覚を探す。"},{"name":"ショルダープレス","sets":3,"reps":"10〜12回","rest":"90秒","tip":"腰を反らせない。"},{"name":"シーテッドロー","sets":3,"reps":"10〜12回","rest":"90秒","tip":"反動を使わない。"},{"name":"シーテッドアームカール","alt":["インシグニア バイセップスカール","ハンマーセレクト バイセップスカール"],"sets":2,"reps":"12〜15回","rest":"60秒","tip":"肘を固定して前腕だけ動かす。"},{"name":"トライセッププレス","alt":["インシグニア トライセッププレス","ハンマーセレクト トライセップエクステンション","デュアル・アジャスタブルプーリー","ダンベル"],"sets":2,"reps":"12〜15回","rest":"60秒","tip":"肘を体の横から動かさない。"}]},{"title":"下半身＋体幹","focus":["脚","臀部","体幹"],"note":"大きい種目から順に。","exercises":[{"name":"レッグプレス","set /* 画面の日本語を英語に置き換える（テキストノード単位で完全一致のみ） */
/* 画面の文言を現在の言語に合わせる。
   元の日本語を各ノードに控えておき、日本語へ戻すときに復元する。
   （控えを持たないと、再描画されない部分が英語のまま残ってしまう）      */
function translateOne(s){
  if(T_UI[s] !== undefined) return T_UI[s];
  if(EX_INFO[s] && EX_INFO[s].en) return EX_INFO[s].en;
  return null;
}
function localize(root){
  const rt = root || document.body;
  const walker = document.createTreeWalker(rt, NodeFilter.SHOW_TEXT, null);
  const jobs = [];
  let n;
  while((n = walker.nextNode())){
    /* 前回こちらが書き込んだ値と違えば、描画で中身が変わったとみなして控えを取り直す */
    if(n.__ja === undefined || n.__out !== n.nodeValue) n.__ja = n.nodeValue;
    const base = n.__ja;
    const s = base.trim();
    if(!s) continue;
    let out = base;
    if(LANG === "en"){
      const tr = translateOne(s);
      if(tr !== null) out = base.replace(s, tr);
    }
    if(out !== n.nodeValue) jobs.push([n, out]);
  }
  jobs.forEach(j=>{ j[0].nodeValue = j[1]; j[0].__out = j[1]; });

  rt.querySelectorAll("[placeholder]").forEach(el=>{
    const cur = el.getAttribute("placeholder") || "";
    if(el.dataset.phJa === undefined || el.dataset.phOut !== cur) el.dataset.phJa = cur;
    const base = el.dataset.phJa;
    let out = base;
    if(LANG === "en"){
      const tr = translateOne(base.trim());
      if(tr !== null) out = tr;
    }
    if(out !== cur){ el.setAttribute("placeholder", out); el.dataset.phOut = out; }
  });
}

function partLabel(id){
  const p = PARTS.find(x=> x.id===id);
  return p ? (LANG==="en" ? p.en : p.ja) : id;
}
/* 種目がどの部位を鍛えるか（自分で追加した種目は未設定になる） */
/* その種目のメインの部位（1つ） */
function mainPart(ex){
  if(!ex) return null;
  if(ex.mainPart) return ex.mainPart;                  // 自分で設定した場合
  const i = EX_INFO[ex.name];
  if(i) return i.m || null;                            // 用途の広い器具は null（部位を決めない）
  return ex.cat==="cardio" ? "cardio" : null;
}
/* メイン＋補助で使う部位 */
function partsOf(ex){
  if(!ex) return [];
  if(Array.isArray(ex.parts) && ex.parts.length) return ex.parts;
  const i = EX_INFO[ex.name];
  if(i) return (i.m ? [i.m] : []).concat(i.s||[]);
  return ex.cat==="cardio" ? ["cardio"] : [];
}
/* 部位で種目を絞る（メインが一致するものを優先し、補助のものは後ろに） */
function exercisesByPart(pid, pool){
  const src = pool || storeExercises();
  const main = src.filter(e=> mainPart(e)===pid);
  const sub  = src.filter(e=> mainPart(e)!==pid && partsOf(e).indexOf(pid)>=0);
  return {main, sub};
}
/* その日に鍛えた部位を集める */
function partsTrained(date){
  const set = [];
  state.exercises.forEach(ex=>{
    const s = (state.sessions[ex.id]||[]).find(x=> x.date===date);
    if(!s || !hasData(s)) return;
    const mp = mainPart(ex);
    if(mp && set.indexOf(mp)<0) set.push(mp);
  });
  return PARTS.filter(p=> set.indexOf(p.id)>=0).map(p=> p.id);
}

/* ============================================================
   1ジム構成（店舗の切り替えは廃止）
   ・以前は店舗ごとに同じマシンを別種目として持っていた
   ・移行時に同名の種目を1つにまとめ、記録も統合する
   ============================================================ */
const GYM_VERSION = 1;
/* 旧コードの名残。種目は常に全件表示する */
function inStore(){ return true; }
function storeExercises(){ return state.exercises; }

function migrateSingleGym(){
  if(state.gymV >= GYM_VERSION){ return; }
  const keep = {};      /* 正規化名 → 残す種目 */
  const order = [];
  (state.exercises||[]).slice().forEach(ex=>{
    const k = norm(ex.name);
    const hit = keep[k];
    if(!hit){ keep[k] = ex; order.push(ex); return; }
    /* 重複していた種目の記録を、残す方へ日付単位で統合する */
    const mine = state.sessions[ex.id] || [];
    const dst  = state.sessions[hit.id] || (state.sessions[hit.id] = []);
    mine.forEach(sv=>{
      const same = dst.find(x=> x.date===sv.date);
      if(!same){ dst.push(sv); return; }
      if(!hasData(same) && hasData(sv)){ dst[dst.indexOf(same)] = sv; return; }
      if(hasData(sv)){
        same.sets = (same.sets||[]).concat(sv.sets||[]).slice(0,20);
        if(!same.memo && sv.memo) same.memo = sv.memo;
      }
    });
    if(!hit.photo && ex.photo) hit.photo = ex.photo;
    delete state.sessions[ex.id];
    if(state.ui && state.ui.currentExId===ex.id) state.ui.currentExId = hit.id;
  });
  state.exercises = order;
  /* 過去の統合で同じ日が2行に分かれている場合があるので、日付でまとめ直す */
  Object.keys(state.sessions).forEach(id=>{
    const arr = state.sessions[id] || [];
    const byDate = {};
    const out = [];
    arr.forEach(sv=>{
      if(!sv || !sv.date) return;
      const hit = byDate[sv.date];
      if(!hit){ byDate[sv.date] = sv; out.push(sv); return; }
      if(!hasData(hit) && hasData(sv)){ out[out.indexOf(hit)] = sv; byDate[sv.date] = sv; return; }
      if(hasData(sv)){
        hit.sets = (hit.sets||[]).concat(sv.sets||[]).slice(0,20);
        if(!hit.memo && sv.memo) hit.memo = sv.memo;
      }
    });
    state.sessions[id] = out.sort((a,b)=> a.date<b.date ? -1 : 1);
  });
  state.exercises.forEach(ex=>{ delete ex.stores; });
  delete state.stores; delete state.storesV;
  if(state.ui) delete state.ui.storeId;
  state.gymV = GYM_VERSION;
  save();
}

/* ---------- 日付ユーティリティ ---------- */
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtDate(s){
  const p = s.split("-"); return Number(p[1])+"/"+Number(p[2]);
}
const WD = ["日","月","火","水","木","金","土"];
const WD_EN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDateFull(s){
  const p = s.split("-");
  const d = new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  if(LANG==="en") return MON_EN[Number(p[1])-1]+" "+Number(p[2])+", "+Number(p[0])+" ("+WD_EN[d.getDay()]+")";
  return Number(p[0])+"年"+Number(p[1])+"月"+Number(p[2])+"日("+WD[d.getDay()]+")";
}
function ymd(y,m,d){ // 数値 -> "2026-07-28"
  return y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function addDays(ds, n){
  const p = ds.split("-").map(Number);
  const d = new Date(p[0], p[1]-1, p[2]); d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

/* ---------- プリセット取り込み ----------
   v4：ジムの設備リストを実物に合わせて総入れ替え
   ・旧名は RENAMES でリネーム（記録・写真はそのまま引き継ぐ）
   ・現行リストにある種目はエリア(cat)を正しい方へ付け直す
   ・現行リストから消えた「プリセット由来かつ記録も写真も無い」種目だけ掃除する
     → 自分で追加した種目・1回でも記録した種目は絶対に消さない            */
function migratePresets(){
  if(typeof state.presetsV !== "number") state.presetsV = 0;
  state.exercises.forEach(ex=>{ if(!ex.cat) ex.cat = "free"; });
  if(state.presetsV >= PRESET_VERSION) return;

  // 1) リネーム（同名が既にある場合は記録を寄せてから重複を落とす）
  state.exercises.forEach(ex=>{ if(RENAMES[ex.name]) ex.name = RENAMES[ex.name]; });
  const byName = {};
  state.exercises.slice().forEach(ex=>{
    const keep = byName[ex.name];
    if(!keep){ byName[ex.name] = ex; return; }
    const mine = state.sessions[ex.id] || [];
    if(mine.length){
      state.sessions[keep.id] = (state.sessions[keep.id]||[]).concat(mine);
    }
    if(!keep.photo && ex.photo) keep.photo = ex.photo;
    delete state.sessions[ex.id];
    state.exercises.splice(state.exercises.indexOf(ex), 1);
  });

  // 2) 現行リストの名前→エリア表（掃除の判定は両店舗のリストを合わせて見る）
  const catOf = {};
  Object.keys(PRESETS).forEach(cat=>{ PRESETS[cat].forEach(n=>{ catOf[n] = cat; }); });
  const listed = {};
  Object.keys(PRESETS).forEach(cat=>{ PRESETS[cat].forEach(n=>{ listed[n] = true; }); });

  // 3) 現行リストに無い＆プリセット由来＆記録も写真も無い → 掃除
  state.exercises = state.exercises.filter(ex=>{
    if(listed[ex.name]) return true;                      // どちらかの店舗の現行リストにある
    const src = String(ex.id).charAt(0);
    if(src !== "p" && src !== "s") return true;           // 自分で追加した種目
    if(ex.photo) return true;                             // 写真がある
    const ss = state.sessions[ex.id] || [];
    if(ss.some(hasData)) return true;                     // 記録がある
    delete state.sessions[ex.id];
    return false;
  });

  // 4) エリアの付け直し
  state.exercises.forEach(ex=>{ if(catOf[ex.name]) ex.cat = catOf[ex.name]; });

  // 5) 足りない種目を追加
  const existing = new Set(state.exercises.map(e=> e.name));
  let seq = 0;
  Object.keys(PRESETS).forEach(cat=>{
    PRESETS[cat].forEach(name=>{
      if(!existing.has(name)){
        state.exercises.push({id:"p"+Date.now().toString(36)+(seq++), name, cat});
        existing.add(name);
      }
    });
  });

  // 6) 並び順をリスト通りに（プリセット外は末尾）
  const order = {}; let i = 0;
  Object.keys(PRESETS).forEach(cat=>{ PRESETS[cat].forEach(n=>{ order[n] = i++; }); });
  state.exercises.sort((a,b)=>{
    const oa = order[a.name]==null ? 9999 : order[a.name];
    const ob = order[b.name]==null ? 9999 : order[b.name];
    return oa - ob;
  });

  // 7) 選択中の種目が消えていたら戻す
  if(!state.exercises.find(e=> e.id===state.ui.currentExId) && state.exercises[0]){
    state.ui.currentExId = state.exercises[0].id;
    state.ui.currentArea = state.exercises[0].cat;
  }

  state.presetsV = PRESET_VERSION;
  save();
}

/* ---------- セッション取得 ---------- */
function sessionsOf(exId){
  return (state.sessions[exId] || []).slice().sort((a,b)=> a.date < b.date ? -1 : 1);
}
function todaySession(exId){
  return (state.sessions[exId]||[]).find(s=> s.date === viewDate) || null;
}
function ensureTodaySession(exId){
  let s = todaySession(exId);
  if(!s){
    s = {date: viewDate, sets:[]};
    if(!state.sessions[exId]) state.sessions[exId] = [];
    state.sessions[exId].push(s);
  }
  return s;
}
/* セッションに実データがあるか（空セッションを前回扱いしないため） */
function hasData(s){
  if(!s) return false;
  if(s.memo && s.memo.trim()) return true;
  if(s.cardio && (s.cardio.min!=null||s.cardio.dist!=null||s.cardio.kcal!=null||s.cardio.hr!=null)) return true;
  return !!(s.sets && s.sets.some(x=> x && (x.w!=null || x.r!=null)));
}
function prevSession(exId){
  const all = sessionsOf(exId).filter(s=> s.date < viewDate && hasData(s));
  return all.length ? all[all.length-1] : null;
}
/* 過去日の空セッションを掃除（開いただけで残ったものを除去） */
function pruneEmptySessions(){
  let changed=false;
  Object.keys(state.sessions).forEach(exId=>{
    const kept = state.sessions[exId].filter(s=> s.date===todayStr() || hasData(s));
    if(kept.length !== state.sessions[exId].length){ state.sessions[exId]=kept; changed=true; }
  });
  if(changed) save();
}

/* ---------- 更新判定 ----------
   ・重量が前回より重い → 更新
   ・同じ重量で回数が増えた → 更新
   （軽い重量で回数だけ多いケースは更新扱いにしていません。
     ここは後で好みに合わせて調整できます）           */
function isPR(cur, prev){
  if(!prev || cur.w==null || cur.r==null) return false;
  if(cur.w > prev.w) return true;
  if(cur.w === prev.w && cur.r > prev.r) return true;
  return false;
}

/* 検索用の正規化。
   ひらがな／カタカナ／半角カナのどれで打っても、
   濁点や小書き文字・長音符の揺れがあっても当たるようにする。   */
const SMALL_KANA = {"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","っ":"つ",
                    "ゃ":"や","ゅ":"ゆ","ょ":"よ","ゎ":"わ","ヵ":"か","ヶ":"け"};
function norm(s){
  let t = String(s);
  /* 半角カナ→全角、全角英数→半角 などをまとめて吸収 */
  try{ t = t.normalize("NFKC"); }catch(e){}
  t = t.toLowerCase()
    /* カタカナ→ひらがな */
    .replace(/[\u30a1-\u30f6]/g, c=> String.fromCharCode(c.charCodeAt(0)-0x60))
    /* ヴァ→バ の揺れを吸収（ヴァーティカル / バーティカル どちらでも当たる） */
    .replace(/\u3094[ぁあ]/g,"は").replace(/\u3094[ぃい]/g,"ひ").replace(/\u3094[ぅう]/g,"ふ")
    .replace(/\u3094[ぇえ]/g,"へ").replace(/\u3094[ぉお]/g,"ほ").replace(/\u3094/g,"ふ")
    /* 濁点・半濁点を落とす（「とれっとみる」でも「トレッドミル」に当たる） */
    .normalize("NFD").replace(/[\u3099\u309a\u309b\u309c]/g,"").normalize("NFC")
    /* 長音符・記号・空白を除去 */
    .replace(/[ー\u30fc\u2010-\u2015~〜]/g,"")
    .replace(/[・･\s（）()［］\[\]／\/,，、。＆&＋+\-－_]/g,"");
  /* 小書き文字を大きい文字に寄せる */
  return t.replace(/[ぁぃぅぇぉっゃゅょゎヵヶ]/g, c=> SMALL_KANA[c] || c);
}
/* 現在の店舗で、記録のある種目を最後に記録した順に並べる */
function recentExercises(){
  const arr = [];
  storeExercises().forEach(ex=>{
    const ss = (state.sessions[ex.id]||[]).filter(hasData);
    if(!ss.length) return;
    let t=0, d="";
    ss.forEach(s=>{ if((s.t||0)>t) t=s.t||0; if(s.date>d) d=s.date; });
    arr.push({ex, t, d});
  });
  arr.sort((a,b)=> a.d===b.d ? b.t-a.t : (a.d<b.d?1:-1));
  return arr.slice(0,15).map(o=> o.ex);
}
function selectExercise(id){

  state.ui.currentExId = id;
  if(ex && state.ui.currentArea!=="recent") state.ui.currentArea = ex.cat;

    localize(sheet);

  }
  tabs.forEach(a=>{
    const b = document.createElement("button");
    b.className = "area-tab" + (a.id===area ? " active":"");
    b.innerHTML = a.name + '<span class="area-n">'+a.n+'</span>';
    b.onclick = ()=>{ state.ui.pickArea = a.id; renderPicker(); };
    tabWrap.appendChild(b);
  });

  const list = document.getElementById("pick-list");
  const items = area==="recent" ? recents : pool.filter(e=> e.cat===area);
  if(!items.length){
    list.innerHTML = '<div class="sr-empty">このエリアに種目がありません</div>';
  }else{
    items.forEach(ex=>{
      const done = (state.sessions[ex.id]||[]).some(hasData);
      const b = document.createElement("button");
      b.className = "pick-item" + (ex.id===state.ui.currentExId ? " active":"");
      const nm = document.createElement("span"); nm.className="pick-name"; nm.textContent = exName(ex.name);
      b.appendChild(nm);
      if(area==="recent"){
        const ar=document.createElement("span"); ar.className="sr-area"; ar.textContent=areaName(ex.cat);
        b.appendChild(ar);
      }else if(done){
        const d=document.createElement("span"); d.className="pick-dot"; b.appendChild(d);
      }
      b.onclick = ()=>{
        state.ui.currentExId = ex.id;
        if(area!=="recent") state.ui.currentArea = ex.cat;
        save(); hideSheet(); renderTrain();
      };
      list.appendChild(b);
    });
  }
  document.getElementById("pick-add").onclick = ()=> openExerciseSheet(null);
  document.getElementById("pick-close").onclick = hideSheet;
}

function renderTrainBody(){
  const body = document.getElementById("train-body");
  const ex = state.exercises.find(e=> e.id === state.ui.currentExId);
  body.innerHTML = "";
  if(!ex){
    body.innerHTML = '<div class="empty-ex"><div class="big">▦</div>種目を追加してください</div>';
    return;
  }
  const prev = prevSession(ex.id);
  const today = ensureTodaySession(ex.id);

  const card = document.createElement("div");
  card.className = "card";

  /* 種目ヘッダ */
  const head = document.createElement("div");
  head.className = "ex-head";
  head.innerHTML = '<span class="name"></span><div class="tools">'+
    '<button class="icon-btn" data-act="edit">✎</button></div>';
  head.querySelector(".name").textContent = exName(ex.name);
  head.querySelector('[data-act="edit"]').onclick = ()=> openExerciseSheet(ex);
  card.appendChild(head);

  if(ex.cat === "cardio"){
    buildCardioCard(card, ex, prev, today);
    buildMemo(card, ex.id, prev, today);
    body.appendChild(card);
    buildTodayList(body, ex.id);
    return;
  }

  /* マシンの参考写真 */

  /* 前回の記録 */
  const ref = document.createElement("div");
  ref.className = "prev-ref";
  if(prev && prev.sets && prev.sets.length){
    const best = prev.sets.reduce((a,b)=> (b.w||0)>(a.w||0)?b:a, prev.sets[0]);
    let sets = prev.sets.map(s=> '<span class="pset'+((s===best)?" top":"")+'"><b>'+fmtNum(s.w)+'</b>kg × <b>'+s.r+'</b></span>').join("");
    ref.innerHTML = '<div class="label"><span>前回の記録</span><span>'+fmtDate(prev.date)+'</span></div>'+
                    '<div class="sets">'+sets+'</div>';
  }else{
    ref.innerHTML = '<div class="label"><span>前回の記録</span></div><div class="prev-empty">まだ記録がありません。今日が1回目です。</div>';
  }
  const hb = document.createElement("button");
  hb.className = "hist-btn";
  hb.innerHTML = '<span>📈 これまでの記録を見る</span><span class="hb-c">›</span>';
  hb.onclick = ()=> openHistory(ex.id);
  ref.appendChild(hb);
  card.appendChild(ref);

  /* 今日のセット */
  const tl = document.createElement("div");
  tl.className = "today-label";
  tl.textContent = (viewDate===todayStr() ? "今日" : fmtDate(viewDate)) + " — セットを記録";
  card.appendChild(tl);

  const sets = today.sets || (today.sets = []);
  sets.forEach((set,i)=>{
    card.appendChild(buildSetRow(ex.id, set, i, prev && prev.sets ? prev.sets[i] : null));
  });

  const addBtn = document.createElement("button");
  addBtn.className = "add-set";
  addBtn.innerHTML = "＋ セットを追加";
  addBtn.onclick = ()=>{
    const t = ensureTodaySession(ex.id);
    if(!t.sets) t.sets = [];
    const idx  = t.sets.length;
    const last = t.sets[idx-1];
    /* 重量はセット間・日をまたいでも引き継ぐ／回数は毎回リセット
       1セット目は前回の同じセット番号（無ければ前回の最終セット）の重量を持ってくる */
    let w = null;
    if(carryWeightOn()){
      if(last && last.w != null) w = last.w;
      else{
        const pv = prevSession(ex.id);
        const ps = pv && pv.sets ? pv.sets : null;
        if(ps && ps.length){
          const src = ps[idx] || ps[ps.length-1];
          if(src && src.w != null) w = src.w;
        }
      }
    }
    t.sets.push({w: w, r:null});
    save(); renderTrainBody();
  };
  card.appendChild(addBtn);
  buildMemo(card, ex.id, prev, today);

  body.appendChild(card);
  buildTodayList(body, ex.id);
}

/* ============================================================
   その日にやったことの一覧
   （種目を1つずつ開かないと分からなかったので、まとめて縦に並べる）
   ============================================================ */
function todayDone(){
  const out = [];
  state.exercises.forEach(ex=>{
    const s = (state.sessions[ex.id]||[]).find(x=> x.date === viewDate);
    if(s && hasData(s)) out.push({ex, s});
  });
  out.sort((a,b)=> (a.s.t||0) - (b.s.t||0));   // 記録した順
  return out;
}
function buildTodayList(body, currentId){
  const done = todayDone();
  const wrap = document.createElement("div");
  wrap.className = "card today-card";

  const isToday = (viewDate === todayStr());
  const head = document.createElement("div");
  head.className = "today-head";
  head.innerHTML = '<span class="th-t">'+(isToday? t("x","今日やったこと","Today\u0027s session") : fmtDate(viewDate)+t("x"," の記録"," session"))+'</span>';
  wrap.appendChild(head);

  if(!done.length){
    const em = document.createElement("div");
    em.className = "today-empty";
    em.textContent = "まだ記録がありません。上で重量と回数を入れると、ここに並びます。";
    wrap.appendChild(em);
    body.appendChild(wrap);
    return;
  }

  /* 合計（重量×回数の総量は、やった量の目安になる） */
  let sets = 0, vol = 0, cardioMin = 0;
  done.forEach(({s})=>{
    (s.sets||[]).forEach(x=>{
      if(x && x.w!=null && x.r!=null){ sets++; vol += x.w*x.r; }
    });
    if(s.cardio && s.cardio.min!=null) cardioMin += s.cardio.min;
  });
  /* 鍛えた部位をひと目で（例：胸・三頭筋） */
  const trained = partsTrained(viewDate);
  if(trained.length){
    const pw = document.createElement("div");
    pw.className = "part-chips";
    trained.forEach(pid=>{
      const c = document.createElement("span");
      c.className = "part-chip";
      c.textContent = partLabel(pid);
      pw.appendChild(c);
    });
    wrap.appendChild(pw);
  }

  const sum = document.createElement("div");
  sum.className = "today-sum";
  let parts = [done.length + t("x","種目"," exercises")];
  if(sets) parts.push(sets + t("x","セット"," sets"));
  if(vol)  parts.push(t("x","総重量 ","Volume ")+Math.round(vol).toLocaleString()+"kg");
  if(cardioMin) parts.push(t("x","有酸素 ","Cardio ")+Math.round(cardioMin)+t("x","分"," min"));
  sum.textContent = parts.join("　/　");
  wrap.appendChild(sum);

  done.forEach(({ex, s})=>{
    const row = document.createElement("button");
    row.className = "tdo" + (ex.id===currentId ? " now" : "");
    const nm = document.createElement("div");
    nm.className = "tdo-n";
    nm.textContent = exName(ex.name);
    row.appendChild(nm);

    const det = document.createElement("div");
    det.className = "tdo-d";
    if(ex.cat === "cardio" && s.cardio){
      const c = s.cardio, bits = [];
      if(c.min!=null)  bits.push(c.min+"分");
      if(c.dist!=null) bits.push(c.dist+"km");
      if(c.kcal!=null) bits.push(c.kcal+"kcal");
      if(c.hr!=null)   bits.push(c.hr+"bpm");
      det.textContent = bits.join("　");
    }else{
      const valid = (s.sets||[]).filter(x=> x && x.w!=null && x.r!=null);
      det.innerHTML = valid.map(x=> '<span class="tdo-s"><b>'+fmtNum(x.w)+'</b>×'+x.r+'</span>').join("");
      if(!valid.length) det.textContent = "（記録なし）";
    }
    row.appendChild(det);

    if(s.memo && s.memo.trim()){
      const mm = document.createElement("div");
      mm.className = "tdo-m";
      mm.textContent = s.memo.trim();
      row.appendChild(mm);
    }
    row.onclick = ()=>{
      state.ui.currentExId = ex.id;
      state.ui.currentArea = ex.cat;
      if(!inStore(ex) && Array.isArray(ex.stores) && ex.stores.length) state.ui.storeId = ex.stores[0];
      save(); renderTrain();
      window.scrollTo({top:0, behavior:"smooth"});
    };
    wrap.appendChild(row);
  });

  body.appendChild(wrap);
}

/* ---------- 感覚メモ（その日の種目ごとに残す） ---------- */
function buildMemo(card, exId, prev, today){
  /* 前回のメモがあれば先に見せる（前回の感覚を思い出してから入力できる） */
  if(prev && prev.memo && prev.memo.trim()){
    const pm = document.createElement("div");
    pm.className = "memo-prev";
    const lb = document.createElement("div");
    lb.className = "memo-prev-l"; lb.textContent = "前回のメモ（"+fmtDate(prev.date)+"）";
    const tx = document.createElement("div");
    tx.className = "memo-prev-t"; tx.textContent = prev.memo;
    pm.appendChild(lb); pm.appendChild(tx);
    card.appendChild(pm);
  }

  const lab = document.createElement("div");
  lab.className = "today-label";
  lab.textContent = "メモ — 今日の感覚";
  card.appendChild(lab);

  const ta = document.createElement("textarea");
  ta.className = "memo-input";
  ta.rows = 2;
  ta.placeholder = "例：肩に効いた／重すぎた／フォームが安定してきた";
  ta.value = today.memo || "";
  function grow(){ ta.style.height="auto"; ta.style.height = Math.max(56, ta.scrollHeight)+"px"; }
  let tmr=null;
  ta.addEventListener("input", ()=>{
    grow();
    clearTimeout(tmr);
    tmr = setTimeout(()=>{
      const t = ensureTodaySession(exId);
      t.memo = ta.value;
      t.t = Date.now();
      save();
    }, 400);
  });
  ta.addEventListener("blur", ()=>{
    const t = ensureTodaySession(exId);
    t.memo = ta.value; save();
  });
  card.appendChild(ta);
  setTimeout(grow, 0);
}
