function fmtC(v){ return v==null ? "–" : v; }

/* ---------- マシンの参考写真 ---------- */

function fmtNum(n){
  if(n==null) return "–";
  return Number.isInteger(n) ? String(n) : String(n);
}

function buildSetRow(exId, set, idx, prevSet){
  const row = document.createElement("div");
  row.className = "set";
  const pr = isPR(set, prevSet);
  if(pr) row.classList.add("pr");

  /* index */
  const si = document.createElement("div");
  si.className = "set-idx num";
  si.textContent = idx+1;
  row.appendChild(si);

  /* weight field */
  const wf = fieldNum({
    value:set.w, placeholder: prevSet? fmtNum(prevSet.w):"kg", unit:"kg", step:WEIGHT_STEP, decimal:true,
    onChange:(v)=>{ set.w = v; commitSet(exId,idx,set); }
  });
  if(pr){ const b=document.createElement("div"); b.className="pr-badge"; b.textContent="更新！"; wf.appendChild(b); }
  row.appendChild(wf);

  /* reps field */
  const rf = fieldNum({
    value:set.r, placeholder: prevSet? String(prevSet.r):"回", unit:"回", step:REPS_STEP, decimal:false,
    onChange:(v)=>{ set.r = v; commitSet(exId,idx,set); }
  });
  row.appendChild(rf);

  /* delete */
  const del = document.createElement("button");
  del.className = "set-del";
  del.textContent = "×";
  del.onclick = ()=>{
    const t = ensureTodaySession(exId);
    t.sets.splice(idx,1);
    save(); renderTrainBody();
  };
  row.appendChild(del);

  return row;
}

function fieldNum({value, placeholder, unit, step, decimal, onChange}){
  /* タップすると縦スクロールの一覧が開く。一覧内から手入力もできる */
  const f = document.createElement("button");
  f.type = "button";
  f.className = "field";

  let cur = (value!=null) ? value : null;

  const valrow = document.createElement("div");
  valrow.className = "valrow";
  const val = document.createElement("span");
  val.className = "val num";
  const u = document.createElement("span"); u.className="unit"; u.textContent = unit;
  valrow.appendChild(val); valrow.appendChild(u);

  const hint = document.createElement("span");
  hint.className = "field-hint";

  function paint(){
    if(cur!=null){ val.textContent = decimal ? cur : Math.round(cur); val.classList.remove("ph"); }
    else{ val.textContent = (placeholder && !isNaN(parseFloat(placeholder))) ? placeholder : "–"; val.classList.add("ph"); }
    /* 「142.5」のような長い数字でも末尾が切れないよう、桁数で文字サイズを落とす */
    const n = val.textContent.length;
    val.classList.remove("d4","d5");
    if(n>=5) val.classList.add("d5");
    else if(n===4) val.classList.add("d4");
    hint.textContent = (cur!=null) ? "タップで変更" : (placeholder && !isNaN(parseFloat(placeholder)) ? "前回の値" : "タップで入力");
  }
  paint();

  f.onclick = ()=>{
    openNumberWheel({
      title: unit==="kg" ? "重量を選ぶ" : (unit==="回" ? "回数を選ぶ" : unit+"を選ぶ"),
      unit, decimal, step,
      current: cur,
      suggest: parseFloat(placeholder),
      onPick:(v)=>{ cur = v; paint(); onChange(v); }
    });
  };

  f.appendChild(valrow); f.appendChild(hint);
  return f;
}

/* ============================================================
   種目ごとの履歴（月単位の推移＋過去の全記録）
   ============================================================ */
function e1rm(w, r){                     // 推定1RM（Epley式）: 重量×回数を1つの指標にまとめる
  if(!w || !r) return 0;
  return w * (1 + r/30);
}
function sessionStats(s){
  const sets = (s.sets||[]).filter(x=> x && x.w!=null && x.r!=null);
  if(!sets.length) return null;
  let maxW=0, vol=0, best=0;
  sets.forEach(x=>{
    if(x.w>maxW) maxW=x.w;
    vol += x.w * x.r;
    const e = e1rm(x.w, x.r);
    if(e>best) best=e;
  });
  return {maxW, vol, e1rm:Math.round(best*10)/10, sets:sets.length};
}

function openHistory(exId){
  state.ui.histMode = state.ui.histMode || "e1rm";
  renderHistory(exId);
  showSheet();
}
function renderHistory(exId){
  const ex = state.exercises.find(e=> e.id===exId);
  const sheet = document.getElementById("sheet");
  const all = sessionsOf(exId).filter(hasData).filter(s=> (s.sets||[]).some(x=>x&&x.w!=null&&x.r!=null));
  const mode = state.ui.histMode;

  if(!all.length){
    sheet.innerHTML = '<h2>これまでの記録</h2><div class="sr-empty">まだ記録がありません</div>'+
      '<div class="sheet-btns"><button class="btn ghost" id="h-close">閉じる</button></div>';
    showSheet();
    document.getElementById("h-close").onclick = hideSheet;
    return;
  }

  /* 月ごとにまとめる（その月のベスト値） */
  const months = {};
  all.forEach(s=>{
    const st = sessionStats(s); if(!st) return;
    const k = s.date.slice(0,7);
    if(!months[k]) months[k] = {maxW:0, vol:0, e1rm:0, days:0};
    const m = months[k];
    m.days++;
    if(st.maxW>m.maxW) m.maxW=st.maxW;
    if(st.e1rm>m.e1rm) m.e1rm=st.e1rm;
    m.vol += st.vol;
  });
  const mKeys = Object.keys(months).sort().slice(-12);

  const MODES = [
    {id:"e1rm", name:"推定1RM", unit:"kg"},
    {id:"maxW", name:"最大重量", unit:"kg"},
    {id:"vol",  name:"総ボリューム", unit:"kg"},
  ];
  const cur = MODES.find(m=> m.id===mode) || MODES[0];

  /* 全体のベスト記録 */
  let allBest = {e1rm:0, maxW:0, date:"", w:0, r:0};
  all.forEach(s=>{
    (s.sets||[]).forEach(x=>{
      if(!x || x.w==null || x.r==null) return;
      const e = e1rm(x.w, x.r);
      if(e > allBest.e1rm){ allBest = {e1rm:Math.round(e*10)/10, maxW:x.w, date:s.date, w:x.w, r:x.r}; }
    });
  });

  /* 直近と最初の比較 */
  const firstK = mKeys[0], lastK = mKeys[mKeys.length-1];
  const dv = months[lastK][mode] - months[firstK][mode];
  const dvTxt = (dv>0?"+":"") + (Math.round(dv*10)/10);

  sheet.innerHTML =
    '<h2>'+escapeHtml(ex?ex.name:"記録")+'</h2>'+
    '<div class="hist-best">'+
      '<div class="hb-l">自己ベスト</div>'+
      '<div class="hb-v num">'+allBest.w+'<span class="hb-u">kg</span> × '+allBest.r+'<span class="hb-u">回</span></div>'+
      '<div class="hb-d">'+fmtDateFull(allBest.date)+'　推定1RM '+allBest.e1rm+'kg</div>'+
    '</div>'+
    '<div class="wmode" id="hist-mode">'+
      MODES.map(m=> '<button class="wmode-btn'+(m.id===mode?" active":"")+'" data-m="'+m.id+'">'+m.name+'</button>').join("")+
    '</div>'+
    '<div class="hist-sum">'+
      '<span>月ごとの'+cur.name+'</span>'+
      '<span class="hs-d '+(dv>0?"up":(dv<0?"down":""))+'">'+(mKeys.length>1? dvTxt+cur.unit : "")+'</span>'+
    '</div>'+
    '<div class="hist-chart" id="hist-chart"></div>'+
    '<div class="pill-label">記録の一覧（新しい順）</div>'+
    '<div class="hist-list" id="hist-list"></div>'+
    '<div class="sheet-btns"><button class="btn ghost" id="h-close">閉じる</button></div>';

  /* 棒グラフ */
  const cw = document.getElementById("hist-chart");
  const vals = mKeys.map(k=> months[k][mode]);
  const max = Math.max(...vals, 1);
  let bars = "";
  mKeys.forEach((k,i)=>{
    const v = vals[i];
    const h = Math.max(3, Math.round(v/max*100));
    const isLast = i===mKeys.length-1;
    bars += '<div class="hbar">'+
      '<div class="hbar-v num">'+(v>=1000? Math.round(v/100)/10+"k" : Math.round(v*10)/10)+'</div>'+
      '<div class="hbar-t"><div class="hbar-f'+(isLast?" now":"")+'" style="height:'+h+'%"></div></div>'+
      '<div class="hbar-l">'+Number(k.slice(5,7))+'月</div>'+
    '</div>';
  });
  cw.innerHTML = '<div class="hbars">'+bars+'</div>';

  /* 履歴リスト */
  const list = document.getElementById("hist-list");
  all.slice().reverse().forEach(s=>{
    const st = sessionStats(s); if(!st) return;
    const row = document.createElement("div");
    row.className = "hrow";
    const sets = (s.sets||[]).filter(x=>x&&x.w!=null&&x.r!=null)
      .map(x=> '<span class="pset"><b>'+fmtNum(x.w)+'</b>×'+x.r+'</span>').join("");
    row.innerHTML =
      '<div class="hrow-h"><span class="hrow-d">'+fmtDateFull(s.date)+'</span>'+
        '<span class="hrow-m">最大 '+st.maxW+'kg</span></div>'+
      '<div class="sets">'+sets+'</div>'+
      (s.memo && s.memo.trim() ? '<div class="hrow-memo">'+escapeHtml(s.memo)+'</div>' : '');
    list.appendChild(row);
  });

  sheet.querySelectorAll("#hist-mode .wmode-btn").forEach(b=>{
    b.onclick = ()=>{ state.ui.histMode = b.dataset.m; save(); renderHistory(exId); };
  });
  document.getElementById("h-close").onclick = hideSheet;
}

/* ============================================================
   数値ピッカー（縦スクロールで選ぶ）
   ±の連打がしんどいという声を受けて追加。よく使う値ほど上に出す。
   ============================================================ */
/* ============================================================
   重量の入力（打ち込みが主役／微調整はスライダー）
   ============================================================ */
/* 一覧を、指定した値がちょうど中央に来る位置までスクロールする */
const LIST_ITEM_H = 54;
function centerListOn(wrap, list, target){
  if(wrap==null || target==null || isNaN(target)) return;
  let idx = 0, bd = Infinity;
  list.forEach((v,i)=>{ const d = Math.abs(v-target); if(d<bd){ bd = d; idx = i; } });
  const h = wrap.clientHeight || 260;
  /* 上下に余白を入れておくと、一覧の端の値でもきちんと中央に来る */
  const pad = Math.max(0, (h - LIST_ITEM_H)/2);
  wrap.style.paddingTop = pad+"px";
  wrap.style.paddingBottom = pad+"px";
  wrap.scrollTop = idx*LIST_ITEM_H;
}

function openKgInput({title, unit, decimal, step, current, suggest, onPick}){
  const has = (v)=> v!=null && !isNaN(v);
  const near = has(current) ? current : (has(suggest) ? suggest : null);

  const sheet = document.getElementById("sheet");
  sheet.innerHTML =
    '<h2>'+title+'</h2>'+
    '<div class="kg-in-row">'+
      '<input class="kg-in num" id="kg-in" type="number" inputmode="decimal" step="0.5" '+
        'placeholder="'+(near!=null?near:"0")+'" value="'+(has(current)?current:"")+'">'+
      '<span class="kg-in-u">kg</span>'+
    '</div>'+
    '<div class="wheel-list" id="kg-list"></div>'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="kg-close">閉じる</button>'+
      '<button class="btn primary" id="kg-ok">決定</button>'+
    '</div>';
  showSheet();

  const inp = document.getElementById("kg-in");

  /* 下の一覧：2.5kg刻み */
  /* 重量の候補：プレートの2.5kg刻みと、ダンベルの2kg刻み(12,14,16…)の両方を出す */
  const list = [];
  const push = v=>{ v=Math.round(v*100)/100; if(list.indexOf(v)<0) list.push(v); };
  [1,1.25,1.5,2,3,4,5,6,7,8,9,10].forEach(push);      // 軽量帯は細かく
  for(let v=2.5; v<=300; v+=2.5) push(v);              // プレート
  for(let v=2;   v<=60;  v+=2)   push(v);              // ダンベル
  list.sort((a,b)=> a-b);
  const wrap = document.getElementById("kg-list");
  let selEl = null;
  list.forEach(v=>{
    const b = document.createElement("button");
    const isNow = has(current) && Math.abs(current-v)<0.001;
    b.className = "wheel-item" + (isNow?" active":"");
    b.innerHTML = '<span class="wv num">'+v+'</span><span class="wu">kg</span>';
    b.onclick = ()=>{ onPick(v); hideSheet(); };
    if(isNow) selEl = b;
    wrap.appendChild(b);
  });

  document.getElementById("kg-ok").onclick = ()=>{
    const v = parseFloat(inp.value);
    if(isNaN(v) || v<0){ inp.focus(); return; }
    onPick(Math.round(v*10)/10);
    hideSheet();
  };
  document.getElementById("kg-close").onclick = hideSheet;

  /* タップするたびに全選択して、そのまま打ち直せるようにする */
  const selectAll = ()=>{ try{ inp.select(); inp.setSelectionRange(0, inp.value.length); }catch(e){} };
  inp.addEventListener("focus", selectAll);
  inp.addEventListener("click", selectAll);
  setTimeout(()=>{ inp.focus(); selectAll(); }, 120);

  /* 一覧は今の値（なければ前回値）の位置まで寄せておく */
  const focusV = has(current) ? current : near;
  centerListOn(wrap, list, focusV);
  setTimeout(()=> centerListOn(wrap, list, focusV), 40);   // シートの表示アニメ後にもう一度合わせる
}

function openNumberWheel({title, unit, decimal, step, current, suggest, onPick, forceList}){
  const sheet = document.getElementById("sheet");
  const isKg = unit === "kg";
  const has = (v)=> v!=null && !isNaN(v);

  /* 重量は「打ち込み」を主役にする（一覧は下の導線から） */
  if(isKg && !forceList){
    openKgInput({title, unit, decimal, step, current, suggest, onPick});
    return;
  }

  /* 候補の作り方：
     重量 → 2.5kg刻みを軸に、前回値や現在値の周辺を厚めに
     回数 → 1〜30を全部 */
  let list = [];
  if(isKg){
    const push = v=>{ v=Math.round(v*100)/100; if(list.indexOf(v)<0) list.push(v); };
    [1,1.25,1.5,2,3,4,5,6,7,8,9,10].forEach(push);
    for(let v=2.5; v<=300; v+=2.5) push(v);
    for(let v=2;   v<=60;  v+=2)   push(v);
    list.sort((a,b)=>a-b);
  }else if(unit === "回"){
    for(let v=1; v<=30; v++) list.push(v);
  }else{
    const base = has(current)? current : (has(suggest)? suggest : 0);
    for(let i=0;i<40;i++){
      const v = Math.max(0, Math.round((base - 20*step + i*step)*10)/10);
      if(list.indexOf(v)<0) list.push(v);
    }
  }

  const near = has(current) ? current : (has(suggest) ? suggest : null);
  sheet.innerHTML =
    '<h2>'+title+'</h2>'+
    (near!=null ? '<div class="wheel-quick" id="wheel-quick"></div>' : '')+
    '<div class="wheel-list" id="wheel-list"></div>'+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="wheel-close">閉じる</button>'+
      '<button class="btn ghost" id="wheel-manual">'+(isKg?"数字で入力":"自分で入力")+'</button>'+
    '</div>';
  showSheet();

  /* 上部に「前回値の周辺」をショートカットで並べる */
  if(near!=null){
    const q = document.getElementById("wheel-quick");
    const offs = isKg ? [-5,-2.5,0,2.5,5] : [-2,-1,0,1,2];
    offs.forEach(o=>{
      const v = Math.round((near+o)*10)/10;
      if(v<=0) return;
      const b = document.createElement("button");
      b.className = "wheel-q" + (o===0?" now":"");
      b.textContent = (decimal? v : Math.round(v));
      b.onclick = ()=>{ onPick(decimal? v : Math.round(v)); hideSheet(); };
      q.appendChild(b);
    });
  }

  const wrap = document.getElementById("wheel-list");
  let selEl = null;
  list.forEach(v=>{
    const b = document.createElement("button");
    const isNow = (has(current) && Math.abs(current-v)<0.001);
    b.className = "wheel-item" + (isNow?" active":"");
    b.innerHTML = '<span class="wv num">'+(decimal? v : Math.round(v))+'</span><span class="wu">'+unit+'</span>';
    b.onclick = ()=>{ onPick(decimal? v : Math.round(v)); hideSheet(); };
    if(isNow) selEl = b;
    wrap.appendChild(b);
  });
  document.getElementById("wheel-close").onclick = hideSheet;
  document.getElementById("wheel-manual").onclick = ()=>{
    sheet.innerHTML =
      '<h2>'+title+'</h2>'+
      '<input class="text num" id="wheel-in" type="number" inputmode="'+(decimal?"decimal":"numeric")+'" '+
        'step="'+step+'" placeholder="'+(near!=null?near:"")+'" value="'+(has(current)?current:"")+'">'+
      '<div class="sheet-btns">'+
        '<button class="btn ghost" id="wi-back">戻る</button>'+
        '<button class="btn primary" id="wi-ok">決定</button>'+
      '</div>';
    const inp = document.getElementById("wheel-in");
    setTimeout(()=>{ inp.focus(); inp.select&&inp.select(); }, 80);
    document.getElementById("wi-back").onclick = ()=> openNumberWheel({title,unit,decimal,step,current,suggest,onPick});
    document.getElementById("wi-ok").onclick = ()=>{
      const v = parseFloat(inp.value);
      if(isNaN(v) || v<0){ inp.focus(); return; }
      onPick(decimal? Math.round(v*10)/10 : Math.round(v));
      hideSheet();
    };
  };
  /* 今の値までスクロールしておく */
  centerListOn(wrap, list, near);
  setTimeout(()=> centerListOn(wrap, list, near), 40);
}

/* セット値が変わったら保存し、更新バッジだけ即時反映するため行を再構築 */
let commitTimer=null;
/* ============================================================
   記録したときの手応え（音・振動・アニメーション）
   ・派手すぎるとジムで邪魔になるので、短く控えめに
   ・音は設定で切れる
   ============================================================ */
function fxOn(){ return state.ui.fx !== false; }

let fxCtx = null;
function beepFx(freqs, dur, vol){
  if(!fxOn()) return;
  try{
    if(!fxCtx) fxCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(fxCtx.state === "suspended") fxCtx.resume();
    const now = fxCtx.currentTime;
    freqs.forEach((f,i)=>{
      const o = fxCtx.createOscillator(), g = fxCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      o.connect(g); g.connect(fxCtx.destination);
      const st = now + i*(dur*0.55);
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(vol, st+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, st+dur);
      o.start(st); o.stop(st+dur+0.02);
    });
  }catch(e){}
}
function buzz(pattern){ if(fxOn() && navigator.vibrate) navigator.vibrate(pattern); }

/* セットを1つ記録できたとき */
function fxSetDone(el){
  beepFx([660], 0.09, 0.13);
  buzz(25);
  if(el){ el.classList.remove("fx-pop"); void el.offsetWidth; el.classList.add("fx-pop"); }
}
/* 自己ベスト更新のとき */
function fxRecord(el){
  beepFx([784, 988, 1319], 0.16, 0.2);
  buzz([30,50,30,50,60]);
  if(el){ el.classList.remove("fx-shine"); void el.offsetWidth; el.classList.add("fx-shine"); }
  confetti();
}
/* 小さな紙吹雪（1秒ほどで消える） */
function confetti(){
  if(!fxOn()) return;
  const wrap = document.createElement("div");
  wrap.className = "confetti";
  const colors = ["#FFA83C","#3DDC8B","#FF7A3D","#F4F8FC"];
  for(let i=0;i<18;i++){
    const p = document.createElement("i");
    p.style.left = (10 + Math.random()*80) + "%";
    p.style.background = colors[i % colors.length];
    p.style.animationDelay = (Math.random()*0.12) + "s";
    p.style.transform = "rotate("+Math.round(Math.random()*360)+"deg)";
    wrap.appendChild(p);
  }
  document.body.appendChild(wrap);
  setTimeout(()=> wrap.remove(), 1400);
}

function commitSet(exId, idx, set){
  const cs = todaySession(exId); if(cs) cs.t = Date.now();   // 「最近」の並び順用
  save();
  /* 重量と回数がそろった瞬間だけ手応えを返す（入力途中では鳴らさない） */
  if(set && set.w!=null && set.r!=null && !set._done){
    set._done = true;
    const rows = document.querySelectorAll("#train-body .set");
    const row = rows[idx] || null;
    const ex = state.exercises.find(e=> e.id===exId);
    const prev = prevSession(exId);
    const ps = prev && prev.sets ? prev.sets[idx] : null;
    if(isPR(set, ps)) fxRecord(row); else fxSetDone(row);
  }else if(set && (set.w==null || set.r==null)){
    set._done = false;
  }
  clearTimeout(commitTimer);
  commitTimer = setTimeout(()=>{
    // 更新バッジの付け外しのために本文だけ再描画（入力中の連打を避けるため軽くdebounce）
    const active = document.activeElement;
    if(active && active.tagName === "INPUT") return; // 入力中は再描画しない
    renderTrainBody();
  }, 50);
}

function escapeHtml(s){ return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function showSheet(){
  document.getElementById("backdrop").classList.add("show");
  localize(document.getElementById("sheet"));
  fitSheet();
}
/* キーボードが出ると表示領域が狭くなる。
   シートは画面下に貼りついているので、キーボードの高さだけ持ち上げないと下端が隠れてしまう。
   ・通常時は高さをCSSに任せる（セーフエリアを引いた値になっている）
   ・キーボードが出ている間だけ、その分を差し引く            */
function fitSheet(){
  const sh = document.getElementById("sheet");
  const bd = document.getElementById("backdrop");
  if(!sh || !bd) return;
  const vv = window.visualViewport;
  if(!vv){ sh.style.maxHeight = ""; bd.style.bottom = ""; return; }
  const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  if(kb > 40){
    bd.style.bottom = kb + "px";
    sh.style.maxHeight = Math.max(220, Math.round(vv.height) - 12) + "px";
  }else{
    bd.style.bottom = "";
    sh.style.maxHeight = "";
  }
}
if(window.visualViewport){
  const onVV = ()=>{ if(document.getElementById("backdrop").classList.contains("show")) fitSheet(); };
  window.visualViewport.addEventListener("resize", onVV);
  window.visualViewport.addEventListener("scroll", onVV);
}
function hideSheet(){
  const bd = document.getElementById("backdrop");
  bd.classList.remove("show");
  bd.style.bottom = "";                     // キーボード用のずらしを元に戻す
  document.getElementById("sheet").style.maxHeight = "";
}
document.getElementById("backdrop").onclick = (e)=>{ if(e.target.id==="backdrop") hideSheet(); };

/* ============================================================
   インターバルタイマー
   ============================================================ */
/* ============================================================
   インターバルタイマー
   ・残り時間は「終了時刻」から毎回計算する（画面を閉じてもズレない）
   ・終了の合図は音声ファイルとして先に再生しておく
     → iPhoneは裏に回るとJavaScriptが止まるが、音の再生は続くため
        別のアプリを見ていても・画面を消していても鳴る
   ============================================================ */
let timer = { total:0, endAt:0, id:null, running:false };
let alarmEl = null, alarmUrl = null, wakeLock = null;

function vibrate(){ if(navigator.vibrate) navigator.vibrate([200,80,200,80,300]); }

/* 「無音 → 終了音」という音声データをその場で作る */
function makeAlarmWav(sec){
  const SR = 6000;                       // 音が分かればよいので低めにして容量を抑える
  const silent = Math.max(0, Math.round(sec*SR));
  const beep   = Math.round(3.0*SR);
  const n = silent + beep;
  const buf = new Uint8Array(44 + n);
  const dv = new DataView(buf.buffer);
  const wr = (o,str)=>{ for(let k=0;k<str.length;k++) buf[o+k]=str.charCodeAt(k); };
  wr(0,"RIFF"); dv.setUint32(4, 36+n, true); wr(8,"WAVEfmt ");
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,SR,true); dv.setUint32(28,SR,true);
  dv.setUint16(32,1,true); dv.setUint16(34,8,true);
  wr(36,"data"); dv.setUint32(40, n, true);
  buf.fill(128, 44);                     // 8bitの無音は128
  /* 終了音：0.15秒鳴らして0.25秒空ける、を繰り返す */
  for(let k=0;k<beep;k++){
    const t = k/SR, ph = t % 0.40;
    if(ph < 0.15){
      const env = Math.min(1, ph/0.01, (0.15-ph)/0.02);
      buf[44+silent+k] = 128 + Math.round(100*env*Math.sin(2*Math.PI*880*t));
    }
  }
  return new Blob([buf], {type:"audio/wav"});
}

function ensureAlarmEl(){
  if(alarmEl) return alarmEl;
  alarmEl = document.createElement("audio");
  alarmEl.setAttribute("playsinline","");
  alarmEl.preload = "auto";
  document.body.appendChild(alarmEl);
  return alarmEl;
}

function startTimer(sec){
  stopAlarm();
  timer.total = sec;
  timer.endAt = Date.now() + sec*1000;
  timer.running = true;
  hideTimerDone();

  /* 音声を仕込む（タップ直後なので再生が許可される） */
  try{
    /* transient = 通知音の扱い。他アプリの音楽を止めず、鳴っている間だけ音量を下げる。
       solo にすると確実に前に出るが、音楽が停止する。                     */
    try{
      if("audioSession" in navigator){
        navigator.audioSession.type = alarmSolo() ? "playback" : "transient";
      }
    }catch(e){}
    const el = ensureAlarmEl();
    if(alarmUrl) URL.revokeObjectURL(alarmUrl);
    alarmUrl = URL.createObjectURL(makeAlarmWav(sec));
    el.src = alarmUrl;
    el.currentTime = 0;
    const pr = el.play();
    if(pr && pr.catch) pr.catch(()=>{});
    if("mediaSession" in navigator){
      const m = Math.floor(sec/60), r = sec%60;
      navigator.mediaSession.metadata = new MediaMetadata({
        title: "インターバル "+(m? m+":"+String(r).padStart(2,"0") : r+"秒"),
        artist: "トレーニングノート"
      });
      try{ navigator.mediaSession.setActionHandler("pause", ()=> resetTimer()); }catch(e){}
      try{ navigator.mediaSession.setActionHandler("stop",  ()=> resetTimer()); }catch(e){}
    }
  }catch(e){}

  requestWake();
  clearInterval(timer.id);
  timer.id = setInterval(tickTimer, 250);
  tickTimer();
}

function tickTimer(){
  if(!timer.running) return;
  const left = Math.ceil((timer.endAt - Date.now())/1000);
  if(left <= 0){
    timer.running = false;
    clearInterval(timer.id);
    updateTimerUI(true);
    vibrate();
    showTimerDone();
    releaseWake();
  }else{
    updateTimerUI();
  }
}

function remainSec(){ return Math.max(0, Math.ceil((timer.endAt - Date.now())/1000)); }

function stopAlarm(){
  try{ if(alarmEl){ alarmEl.pause(); alarmEl.currentTime = 0; } }catch(e){}
}
function resetTimer(){
  clearInterval(timer.id);
  timer.running=false; timer.endAt=0; timer.total=0;
  stopAlarm(); releaseWake(); hideTimerDone();
  updateTimerUI();
}

/* 休憩中に画面が消えないようにする（対応している端末のみ） */
async function requestWake(){
  try{
    if("wakeLock" in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
    }
  }catch(e){}
}
function releaseWake(){ try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){} }

function updateTimerUI(finished){
  const t = document.getElementById("t-time");
  const lbl = document.getElementById("t-label");
  const prog = document.getElementById("t-progress");
  if(timer.running){
    const left = remainSec();
    const m = Math.floor(left/60), s = left%60;
    t.textContent = m+":"+String(s).padStart(2,"0");
    t.classList.remove("idle","done");
    t.classList.toggle("soon", left<=10);
    lbl.textContent = "残り";
    prog.style.width = (timer.total? (left/timer.total*100):0)+"%";
  }else if(finished){
    t.textContent = "完了"; t.classList.remove("idle","soon"); t.classList.add("done");
    lbl.textContent = "インターバル";
    prog.style.width = "0%";
  }else{

/* 期間集計（日=直近21件 / 週=週平均 / 月=月平均、いずれも直近まで） */
/* グラフの色はCSSの変数から取る（テーマを変えても線と塗りがズレない） */
function cssVar(name, fallback){
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback;
}
const C_PRI   = cssVar("--pri",   "#FFA83C");
const C_GREEN = cssVar("--green", "#3DDC8B");
const C_BG    = cssVar("--bg",    "#0B0F16");

function weekKey(ds){
  const p=ds.split("-").map(Number); const d=new Date(p[0],p[1]-1,p[2]);
  const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function aggregateWeights(mode){
  const data = state.weights.slice().sort((a,b)=> a.date<b.date?-1:1);
  if(mode==="day") return data.slice(-21).map(d=>({kg:d.kg}));
  const keyFn = mode==="week" ? weekKey : (ds=> ds.slice(0,7));
  const groups = {};
  data.forEach(d=>{ const k=keyFn(d.date); (groups[k]=groups[k]||[]).push(d.kg); });
  return Object.keys(groups).sort().map(k=>{
    const arr=groups[k]; return {kg: Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10};
  }).slice(-12);
}

function renderWeightChart(){
  const wrap = document.getElementById("w-chart");
  const stats = document.getElementById("w-stats");
  const daily = state.weights.slice().sort((a,b)=> a.date<b.date?-1:1);
  const mode = state.ui.wMode || "week";
  const series = aggregateWeights(mode);

  if(series.length < 2){
    stats.innerHTML = "";
    const need = mode==="day" ? "2日" : (mode==="week" ? "2週" : "2か月");
    wrap.innerHTML = '<div class="chart-empty">'+need+'分そろうとグラフが表示されます</div>';
    // 統計だけは1件でも出す
    if(daily.length){
      const latest = daily[daily.length-1].kg;
      stats.innerHTML = '<div class="stat"><div class="k">現在</div><div class="v num">'+latest+'<span style="font-size:13px;color:var(--muted)"> kg</span></div></div>';
    }
    return;
  }

  const kgs = series.map(d=>d.kg);
  let min = Math.min(...kgs), max = Math.max(...kgs);
  const goal = state.weightGoal;
  if(goal!=null){ min=Math.min(min,goal); max=Math.max(max,goal); }
  const pad = Math.max((max-min)*0.15, 0.5);
  min -= pad; max += pad;

  const W = Math.max(wrap.clientWidth || 340, 240);
  const H = 180, PX = 8, PY = 14;
  const n = series.length;
  const x = i=> PX + (i/(n-1))*(W-2*PX);
  const y = v=> PY + (H-2*PY) - ((v-min)/(max-min))*(H-2*PY);

  let line="", area="M"+x(0).toFixed(1)+","+H;
  series.forEach((d,i)=>{
    const px=x(i), py=y(d.kg);
    line += (i===0?"M":"L")+px.toFixed(1)+","+py.toFixed(1)+" ";
    area += " L"+px.toFixed(1)+","+py.toFixed(1);
  });
  area += " L"+x(n-1).toFixed(1)+","+H+" Z";
  let dots="";
  series.forEach((d,i)=>{
    const last = i===n-1;
    dots += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(d.kg).toFixed(1)+'" r="'+(last?4:2.5)+'" fill="'+C_PRI+'"'+(last?' stroke="'+C_BG+'" stroke-width="2"':'')+'/>';
  });

  // 目標ライン
  let goalLine="";
  if(goal!=null){
    const gy = y(goal).toFixed(1);
    goalLine =
      '<line x1="'+PX+'" y1="'+gy+'" x2="'+(W-PX)+'" y2="'+gy+'" stroke="'+C_GREEN+'" stroke-width="1.5" stroke-dasharray="5 4"/>'+
      '<text x="'+(W-PX)+'" y="'+(y(goal)-5).toFixed(1)+'" text-anchor="end" fill="'+C_GREEN+'" font-size="11" font-weight="700">'+t("x","目標","Goal")+' '+goal+'</text>';
  }

  wrap.innerHTML =
    '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px">'+
      '<defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="rgba(255,168,60,.45)"/>'+
        '<stop offset="100%" stop-color="rgba(255,168,60,0)"/>'+
      '</linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#wg)"/>'+
      goalLine+
      '<path d="'+line+'" fill="none" stroke="'+C_PRI+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>'+
      dots+
    '</svg>';

  // 統計（日次データから算出）
  const latest = daily[daily.length-1].kg;
  const first = daily[0].kg;
  const diff = Math.round((latest-first)*10)/10;
  const diffCls = diff<0 ? "up" : (diff>0 ? "down":"");
  const diffTxt = (diff>0?"+":"")+diff+"kg";
  let second;
  if(goal!=null){
    const r = Math.round((latest-goal)*10)/10;
    const rTxt = Math.abs(r)<0.05 ? "達成" : ((r>0?"−":"+")+Math.abs(r)+"kg");
    second = '<div class="stat"><div class="k">目標まで</div><div class="v num '+(Math.abs(r)<0.05?"up":"")+'">'+rTxt+'</div></div>';
  }else{
    second = '<div class="stat"><div class="k">記録開始から</div><div class="v num '+diffCls+'">'+diffTxt+'</div></div>';
  }
  stats.innerHTML =
    '<div class="stat"><div class="k">現在</div><div class="v num">'+latest+'<span style="font-size:13px;color:var(--muted)"> kg</span></div></div>'+
    second;
}

/* ============================================================
   メニュー（あらかじめ用意したデータを表示する。通信なし・費用なし）
   ============================================================ */
/* ============================================================
   マイメニュー（自分の記録から自動でできるメニュー表）
   ・部位ごとに「いつもやっている種目」を、やる順番と平均セット数つきで出す
   ・まだやっていない種目も並べて、新しい挑戦のきっかけにする
   ============================================================ */
function myMenu(pid){
  /* その部位がメインの種目を、実際にやった日ごとに集計する */
  const pool = storeExercises();
  const {main, sub} = exercisesByPart(pid, pool);
  const targets = main.concat(sub);

  const stat = {};
  targets.forEach(ex=>{
    const ss = (state.sessions[ex.id]||[]).filter(hasData);
    if(!ss.length){ stat[ex.id] = null; return; }
    let sets=0, wsum=0, wn=0, best=0, last="";
    ss.forEach(x=>{
      const v = (x.sets||[]).filter(y=> y && y.w!=null && y.r!=null);
      sets += v.length;
      v.forEach(y=>{ wsum += y.w; wn++; if(y.w>best) best=y.w; });
      if(x.date > last) last = x.date;
    });
    stat[ex.id] = {days:ss.length, sets:sets, avgSets: ss.length? Math.round(sets/ss.length*10)/10 : 0,
                   best:best, last:last, order:orderOf(ex.id)};
  });

  const done = targets.filter(e=> stat[e.id]).sort((a,b)=>{
    const A=stat[a.id], B=stat[b.id];
    if(A.order !== B.order) return A.order - B.order;   // いつもやる順
    return B.days - A.days;
  });
  const todo = targets.filter(e=> !stat[e.id]);
  return {done, todo, stat};
}

/* その種目が、その日の何番目に行われることが多いか（平均の順番） */
function orderOf(exId){
  const pos = [];
  const dates = {};
  Object.keys(state.sessions).forEach(id=>{
    (state.sessions[id]||[]).forEach(s=>{
      if(!hasData(s)) return;
      (dates[s.date] = dates[s.date] || []).push({id:id, t:s.t||0});
    });
  });
  Object.keys(dates).forEach(d=>{
    const arr = dates[d].sort((a,b)=> a.t-b.t);
    const i = arr.findIndex(x=> x.id===exId);
    if(i>=0) pos.push(i+1);
  });
  if(!pos.length) return 99;
  return pos.reduce((a,b)=>a+b,0)/pos.length;
}

/* メニューの種目名を、この店舗にある種目に結びつける */
function resolveEx(item){
  const cand = [item.name].concat(item.alt || []);
  for(let i=0;i<cand.length;i++){
    const nq = norm(cand[i]);
    const hit = state.exercises.find(e=> inStore(e) && norm(e.name)===nq)
             || state.exercises.find(e=> inStore(e) && norm(e.name).indexOf(nq)>=0);
    if(hit) return hit;
  }
  return null;
}

let calCtx = null;   // {target:"train"|"weight", y, m, yearMode}

function openCalendar(target){
  const base = (target==="weight") ? weightDate : viewDate;
  calCtx = {target, y:Number(base.slice(0,4)), m:Number(base.slice(5,7)), yearMode:false};

/* 記録のある日を集める（カレンダー上に点で表示） */
function datesWithData(target){
  const set = new Set();
  if(target==="weight"){
    state.weights.forEach(w=> set.add(w.date));
  }else{
    Object.keys(state.sessions).forEach(exId=>{
      (state.sessions[exId]||[]).forEach(s=>{ if(hasData(s)) set.add(s.date); });
    });
  }
  return set;
}
function renderCalendar(){
  const sheet = document.getElementById("sheet");
  const {target,y,m} = calCtx;
  const selected = (target==="weight") ? weightDate : viewDate;
  const today = todayStr();
  const marks = datesWithData(target);
  const gmap  = (target==="weight") ? null : groupsByMonth(y, m);

  /* --- 年選択モード --- */
  if(calCtx.yearMode){
    const thisY = Number(today.slice(0,4));
    let years = "";
    for(let yy=thisY; yy>=thisY-9; yy--){
      years += '<button class="cal-year'+(yy===y?" active":"")+'" data-y="'+yy+'">'+yy+'年</button>';
    }
    sheet.innerHTML =
      '<h2>年を選ぶ</h2><div class="cal-years">'+years+'</div>'+
      '<div class="sheet-btns"><button class="btn ghost" id="cal-back">戻る</button></div>';
    sheet.querySelectorAll(".cal-year").forEach(b=>{
      b.onclick = ()=>{ calCtx.y = Number(b.dataset.y); calCtx.yearMode=false; renderCalendar(); };
    });
    document.getElementById("cal-back").onclick = ()=>{ calCtx.yearMode=false; renderCalendar(); };
    return;
  }

  /* --- 月表示 --- */
  const first = new Date(y, m-1, 1).getDay();      // 月初の曜日(0=日)
  const days  = new Date(y, m, 0).getDate();        // 月の日数
  const nextDisabled = (y>Number(today.slice(0,4))) ||
                       (y===Number(today.slice(0,4)) && m>=Number(today.slice(5,7)));

  let cells = "";
  for(let i=0;i<first;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=days; d++){
    const ds = ymd(y,m,d);
    const cls = ["cal-cell"];
    if(ds===selected) cls.push("sel");
    if(ds===today)    cls.push("today");
    if(ds>today)      cls.push("future");
    let dot = "";
    if(gmap){
      const gs = gmap[ds] || [];
      if(gs.length){
        dot = '<span class="cal-parts">'+
              gs.slice(0,4).map(id=> '<i style="background:'+groupColor(id)+'"></i>').join("")+
              '</span>';
      }
    }else if(marks.has(ds)){
      dot = '<span class="cal-dot"></span>';
    }
    cells += '<button class="'+cls.join(" ")+'" data-d="'+ds+'"'+(ds>today?' disabled':'')+'>'+d+dot+'</button>';
  }

  sheet.innerHTML =
    '<div class="cal-head">'+
      '<button class="cal-nav" id="cal-prev">‹</button>'+
      '<button class="cal-title" id="cal-title">'+y+'年 '+m+'月 <span class="cal-caret">▾</span></button>'+
      '<button class="cal-nav" id="cal-next"'+(nextDisabled?' disabled':'')+'>›</button>'+
    '</div>'+
    '<div class="cal-wd">'+WD.map((w,i)=>'<span class="'+(i===0?"sun":(i===6?"sat":""))+'">'+w+'</span>').join("")+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+
    (gmap ? calSummary(gmap, y, m) + calLegend(gmap) : "")+
    '<div class="sheet-btns">'+
      '<button class="btn ghost" id="cal-close">閉じる</button>'+
      '<button class="btn primary" id="cal-today">今日</button>'+
    '</div>';

  document.getElementById("cal-prev").onclick = ()=>{
    calCtx.m--; if(calCtx.m<1){ calCtx.m=12; calCtx.y--; } renderCalendar();
  };
  document.getElementById("cal-next").onclick = ()=>{
    if(nextDisabled) return;
    calCtx.m++; if(calCtx.m>12){ calCtx.m=1; calCtx.y++; } renderCalendar();
  };
  document.getElementById("cal-title").onclick = ()=>{ calCtx.yearMode=true; renderCalendar(); };
  document.getElementById("cal-close").onclick = hideSheet;
  document.getElementById("cal-today").onclick = ()=> pickDate(today);
  sheet.querySelectorAll(".cal-cell[data-d]").forEach(b=>{
    b.onclick = ()=> pickDate(b.dataset.d);
  });
}

  else{ viewDate = ds; hideSheet(); renderTrain(); }

/* ============================================================
   バックアップ（書き出し／読み込み）
   ・APIキーは書き出しに含めない（他人に渡っても悪用されないように）
   ・読み込みは中身を検証してから、確認を取って置き換える
   ============================================================ */
const BACKUP_FORMAT = "training-note-backup";

function exportData(){
  const dump = {};
  Object.keys(state).forEach(k=>{ dump[k]=state[k]; });
  const payload = {
    format: BACKUP_FORMAT, formatVersion: 1,
    exportedAt: new Date().toISOString(),
    data: dump
  };
  const txt = JSON.stringify(payload, (k,v)=> (typeof k==="string" && k.charAt(0)==="_") ? undefined : v);
  const d = todayStr().replace(/-/g,"");
  const name = "トレーニングノート_"+d+".json";
  const kb = Math.round(txt.length/1024);

  const done = (how)=>{
    state.ui.lastExport = Date.now();
    state.ui.exportSnooze = 0;
    save();
    hideBackupReminder();
    const note = document.getElementById("bk-note");
    if(note) note.innerHTML = "書き出しました（約"+kb+"KB）。<b>"+how+"</b>";
  };

  /* 保存その2：従来どおりダウンロードする（共有シートが使えない環境用） */
  const download = ()=>{
    try{
      const url = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 1000);
      done("ファイルアプリやメールに保存しておいてください。");
    }catch(e){
      toast("書き出しに失敗しました");
    }
  };

  /* 保存その1：iPhoneは共有シートを直接開く。
     「ファイルに保存」まで1タップで届くので、ダウンロード経由より確実に残せる。
     ・share() は指で押した流れの中で呼ぶ必要があるので、ここで同期的に呼ぶ
     ・ユーザーが閉じただけ（AbortError）のときは、失敗扱いにしない */
  try{
    if(navigator.share && navigator.canShare){
      const file = new File([txt], name, {type:"application/json"});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:name})
          .then(()=> done("「ファイルに保存」を選んでおくと安心です。"))
          .catch(err=>{ if(!err || err.name !== "AbortError") download(); });
        return;
      }
    }
  }catch(e){ /* 共有が使えない端末は下のダウンロードへ */ }
  download();
}

/* 画面が古いままのときに、キャッシュを貫通して読み直す。
   記録はURL（オリジン）ごとに保存されるので、?v= を足しても消えない。 */
function forceReload(){
  const go = ()=>{
    const u = new URL(location.href);
    u.searchParams.set("v", Date.now().toString(36));
    location.replace(u.toString());
  };
  try{
    if(window.caches && caches.keys){
      caches.keys().then(ks=> Promise.all(ks.map(k=> caches.delete(k)))).then(go, go);
      return;
    }
  }catch(e){}
  go();
}

/* 「控えを取りませんか」バナー
   記録はこの端末の中だけにあるので、書き出しを忘れると機種変更やURL変更で消える。
   思い出すのを本人任せにしない。                                    */
const BKREM_DAY = 86400000;
function hideBackupReminder(){
  const el = document.getElementById("bkrem");
  if(el) el.classList.remove("show");
}
function initBackupReminder(){
  const el = document.getElementById("bkrem");
  if(!el || !state || !state.ui) return;
  if(typeof signedIn === "function" && signedIn()) return;   // 同期中なら不要

  /* 使い始めた初日から急かさない。記録が3日分たまってから初めて声をかける */
  const days = {};
  Object.keys(state.sessions||{}).forEach(k=>{
    (state.sessions[k]||[]).forEach(x=>{ if(x && x.date && hasData(x)) days[x.date]=1; });
  });
  (state.weights||[]).forEach(w=>{ if(w && w.date) days[w.date]=1; });
  if(Object.keys(days).length < 3) return;

  const now = Date.now();
  const last = state.ui.lastExport || 0;
  if(now - (state.ui.exportSnooze || 0) < 7*BKREM_DAY) return;
  if(last && now - last < 14*BKREM_DAY) return;

  const ago = last ? Math.floor((now-last)/BKREM_DAY) : 0;
  document.getElementById("bkrem-b").innerHTML = last
    ? '最後に書き出してから <b>'+ago+'日</b>。記録は<b>この端末の中だけ</b>にあります。'
    : '記録は<b>この端末の中だけ</b>にあります。書き出してファイルに残しておくと安心です。';

  setTimeout(()=>{
    const a = document.getElementById("a2hs");
    if(a && a.classList.contains("show")) return;             // 追加案内と重ねない
    el.classList.add("show");
  }, 2200);

  document.getElementById("bkrem-go").onclick = ()=>{ hideBackupReminder(); exportData(); };
  document.getElementById("bkrem-x").onclick = ()=>{
    hideBackupReminder();
    state.ui.exportSnooze = Date.now();                       // 1週間だけ黙る
    save();
  };
}

function importData(file){
  const note = document.getElementById("bk-note");
  const fr = new FileReader();
  fr.onload = ()=>{
    let p;
    try{ p = JSON.parse(fr.result); }
    catch(e){ if(note) note.innerHTML = '<b style="color:var(--red)">読み込めませんでした。</b>ファイルが壊れているようです。'; return; }

    /* 中身の検証（別のアプリのファイルを読み込んで壊さないように） */
    const d = (p && p.format===BACKUP_FORMAT && p.data) ? p.data : p;
    if(!d || !Array.isArray(d.exercises) || typeof d.sessions !== "object" || d.sessions===null){
      if(note) note.innerHTML = '<b style="color:var(--red)">このアプリのバックアップではないようです。</b>';
      return;
    }
    const exN = d.exercises.length;
    let recN = 0;
    Object.keys(d.sessions).forEach(k=>{ (d.sessions[k]||[]).forEach(x=>{ if(x&&x.date) recN++; }); });
    const wN = Array.isArray(d.weights) ? d.weights.length : 0;
    const when = p.exportedAt ? p.exportedAt.slice(0,10) : "不明";

    if(!confirm(
      "このバックアップを読み込みます。\n\n"+
      "書き出した日: "+when+"\n"+
      "種目 "+exN+"件 / 記録 "+recN+"日分 / 体重 "+wN+"件\n\n"+
      "※ いまこの端末にある記録は置き換わります。\n続けますか？")) return;

    /* アカウント・プラン・AIの利用状況は、この端末のものを残す（記録だけ入れ替える） */
    const keep = {account: state.account, plan: state.plan, aiUsage: state.aiUsage, aiChat: state.aiChat};

    state = d;
    if(!state.ui) state.ui = {};
    state.ui.q = "";
    state.account = keep.account || null;
    state.plan    = keep.plan || "free";
    state.aiUsage = keep.aiUsage || null;
    state.aiChat  = keep.aiChat || [];
    delete state.gymV;                       // 旧データは必ず統合し直す
    if(!save()){ if(note) note.innerHTML = '<b style="color:var(--red)">保存できませんでした。</b>容量が足りない可能性があります。'; return; }

    /* 古いバックアップでも今の形式に合わせ直す（店舗ごとの重複はここで1つにまとまる） */
    const beforeEx = state.exercises.length;
    migratePresets(); migrateSingleGym(); pruneEmptySessions();
    const cur = state.exercises.find(e=> e.id===state.ui.currentExId);
    if(!cur){
      const first = state.exercises[0];
      state.ui.currentExId = first ? first.id : null;
      state.ui.currentArea = first ? first.cat : null;
    }
    let days = {};
    Object.keys(state.sessions).forEach(k=> (state.sessions[k]||[]).forEach(x=>{ if(x && x.date && hasData(x)) days[x.date]=1; }));
    const merged = beforeEx - state.exercises.length;
    save(); hideSheet(); renderTrain(); renderWeight();
    toast("記録 "+Object.keys(days).length+"日分を移しました"+(merged>0 ? "（重複マシン "+merged+" 件を統合）" : ""));
  };
  fr.onerror = ()=>{ if(note) note.innerHTML = '<b style="color:var(--red)">ファイルを読めませんでした。</b>'; };
  fr.readAsText(file);
}

  try{

        {src:APP_ICON, sizes:"512x512", type:"image/png", purpose:"maskable"}
      ]
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:"application/manifest+json"}));
    link("manifest", url);                      // Android
  }catch(e){ /* 失敗しても通常のブラウザ利用には影響しない */ }
})();

/* ============================================================
   ホーム画面への追加案内（初回のみ・端末で文言を出し分け）
   ============================================================ */
(function a2hs(){
  const el = document.getElementById("a2hs");
  const standalone = window.matchMedia("(display-mode: standalone)").matches
                  || window.navigator.standalone === true;
  let dismissed = false;
  try{ dismissed = localStorage.getItem("gymlog.a2hs") === "1"; }catch(e){}
  if(standalone || dismissed) return;

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  const steps = isIOS
    ? '下の <b>共有ボタン（□に↑）</b> → <b>「ホーム画面に追加」</b> を選ぶと、アプリとして開けます。<br><span class="a2hs-warn">Safariでこの操作をしないと、記録が数日で消えることがあります。</span>'
    : '右上の <b>⋮ メニュー</b> → <b>「ホーム画面に追加」</b>（または「アプリをインストール」）を選ぶと、アプリとして開けます。';
  document.getElementById("a2hs-steps").innerHTML = steps;
  setTimeout(()=> el.classList.add("show"), 1200);
  document.getElementById("a2hs-x").onclick = ()=>{
    el.classList.remove("show");
    try{ localStorage.setItem("gymlog.a2hs","1"); }catch(e){}
  };
})();

/* ============================================================
   部位グループ（カレンダーで一目で分かるようにするための色分け）
   ============================================================ */
const GROUPS = [
  {id:"chest",     ja:"胸",     en:"Chest",     color:"#FF6B6B", parts:["chest"]},
  {id:"back",      ja:"背中",   en:"Back",      color:"#4DA3FF", parts:["back"]},
  {id:"shoulders", ja:"肩",     en:"Shoulders", color:"#FFD166", parts:["shoulders"]},
  {id:"arms",      ja:"腕",     en:"Arms",      color:"#C77DFF", parts:["biceps","triceps"]},
  {id:"legs",      ja:"脚",     en:"Legs",      color:"#3DDC8B", parts:["quads","hams","glutes","calves"]},
  {id:"abs",       ja:"お腹",   en:"Core",      color:"#FF9F45", parts:["abs"]},
  {id:"cardio",    ja:"有酸素", en:"Cardio",    color:"#22D3EE", parts:["cardio"]},
];
function groupColor(id){ const g = GROUPS.find(g=> g.id===id); return g ? g.color : "var(--muted)"; }
function groupLabel(id){ const g = GROUPS.find(g=> g.id===id); return g ? (LANG==="en"?g.en:g.ja) : id; }
function groupsOf(ex){
  const out = [];
  partsOf(ex).forEach(pid=>{
    const g = GROUPS.find(g=> g.parts.indexOf(pid)>=0);
    if(g && out.indexOf(g.id)<0) out.push(g.id);
  });
  return out;
}
/* 指定月の「日付 → 鍛えた部位」を一度の走査で作る */
function groupsByMonth(y, m){
  const pre = String(y)+"-"+String(m).padStart(2,"0");
  const out = {};
  state.exercises.forEach(ex=>{
    const arr = state.sessions[ex.id] || [];
    let gs = null;
    arr.forEach(sv=>{
      if(!sv || !sv.date || sv.date.slice(0,7)!==pre || !hasData(sv)) return;
      if(gs===null) gs = groupsOf(ex);
      if(!gs.length) return;
      const cur = out[sv.date] || (out[sv.date] = []);
      gs.forEach(g=>{ if(cur.indexOf(g)<0) cur.push(g); });
    });
  });
  Object.keys(out).forEach(d=>{
    out[d] = GROUPS.filter(g=> out[d].indexOf(g.id)>=0).map(g=> g.id);
  });
  return out;
}
function calLegend(gmap){
  const used = [];
  Object.keys(gmap).forEach(d=> gmap[d].forEach(g=>{ if(used.indexOf(g)<0) used.push(g); }));
  if(!used.length) return "";
  const items = GROUPS.filter(g=> used.indexOf(g.id)>=0)
    .map(g=> '<span><i style="background:'+g.color+'"></i>'+groupLabel(g.id)+'</span>').join("");
  return '<div class="cal-legend">'+items+'</div>';
}
function calSummary(gmap, y, m){
  const days = Object.keys(gmap).length;
  if(!days) return '<div class="cal-sum">'+t("x","この月はまだ記録がありません","No records this month")+'</div>';
  return '<div class="cal-sum">'+m+t("x","月は ","/ ")+'<b>'+days+'</b>'+t("x","日 トレーニングしました","days trained")+'</div>';
}

/* ============================================================
   連続記録（続けている実感を出すための表示）
   ============================================================ */
function trainedDates(){
  const set = {};
  Object.keys(state.sessions).forEach(id=>{
    (state.sessions[id]||[]).forEach(sv=>{ if(sv && sv.date && hasData(sv)) set[sv.date] = true; });
  });
  return set;
}
function streakInfo(){
  const set = trainedDates();
  const today = todayStr();
  /* 連続週：今日（または昨日）から数えて、間が2日以上あくまでを1本と数える */
  let streak = 0, cur = set[today] ? today : addDays(today,-1);
  if(!set[cur]) return {streak:0, week:weekCount(set), total:Object.keys(set).length};
  while(set[cur]){ streak++; cur = addDays(cur,-1); }
  return {streak, week:weekCount(set), total:Object.keys(set).length};
}
function weekCount(set){
  let n = 0;
  for(let i=0;i<7;i++){ if(set[addDays(todayStr(),-i)]) n++; }
  return n;
}
function renderStreak(){
  const el = document.getElementById("streak");
  if(!el) return;
  const s = streakInfo();
  if(s.streak > 0){
    el.className = "streak";
    el.textContent = "🔥 "+s.streak+t("x","日連続"," days");
  }else if(s.week > 0){
    el.className = "streak";
    el.textContent = "🔥 "+t("x","今週","this week")+" "+s.week+t("x","回","");
  }else{
    el.className = "streak zero";
    el.textContent = t("x","今日から始めよう","start today");
  }
}

async function signIn(provider){
  if(!CLOUD_CONFIG.enabled){ openHandoverSheet(provider); return; }
  try{
    const appMod  = await import(CLOUD_CONFIG.sdk+"firebase-app.js");
    const authMod = await import(CLOUD_CONFIG.sdk+"firebase-auth.js");
    if(!cloudApp) cloudApp = appMod.initializeApp(CLOUD_CONFIG.firebase);
    cloudAuth = authMod.getAuth(cloudApp);
    const pv = provider==="apple"
      ? new authMod.OAuthProvider("apple.com")
      : new authMod.GoogleAuthProvider();
    const cred = await authMod.signInWithPopup(cloudAuth, pv);
    const u = cred.user;
    state.account = {uid:u.uid, name:u.displayName||"", email:u.email||"", provider:provider, syncedAt:0};
    save();
    await cloudSync(true);
    openSettingsSheet(false);
  }catch(e){
    console.error(e);
    toast("サインインできませんでした");
  }
}
function signOut(){
  if(!confirm("サインアウトします。この端末の記録は残ります。よろしいですか？")) return;
  state.account = null; save();
  try{ if(cloudAuth) cloudAuth.signOut(); }catch(e){}
  openSettingsSheet(false);
}
/* 端末 → クラウド（保存のたびに少し待ってからまとめて送る） */
function scheduleCloudPush(){
  if(!CLOUD_CONFIG.enabled || !signedIn()) return;
  clearTimeout(cloudPushTimer);
  cloudPushTimer = setTimeout(()=> cloudPush().catch(()=>{}), 4000);
}
async function cloudDoc(){
  const appMod = await import(CLOUD_CONFIG.sdk+"firebase-app.js");
  const fs     = await import(CLOUD_CONFIG.sdk+"firebase-firestore.js");
  if(!cloudApp) cloudApp = appMod.initializeApp(CLOUD_CONFIG.firebase);
  if(!cloudDb)  cloudDb  = fs.getFirestore(cloudApp);
  return {fs, ref: fs.doc(cloudDb, "users", state.account.uid)};
}
async function cloudPush(){
  if(!CLOUD_CONFIG.enabled || !signedIn()) return;
  const {fs, ref} = await cloudDoc();
  const dump = {}; Object.keys(state).forEach(k=>{ if(k!=="account") dump[k] = state[k]; });
  await fs.setDoc(ref, {updatedAt: state.updatedAt || Date.now(), payload: JSON.stringify(dump)});
  state.account.syncedAt = Date.now();
}
/* クラウド → 端末（新しい方を採用する） */
async function cloudSync(loud){
  if(!CLOUD_CONFIG.enabled){ if(loud) openHandoverSheet(null); return; }
  if(!signedIn()){ if(loud) toast("先にサインインしてください"); return; }
  try{
    const {fs, ref} = await cloudDoc();
    const snap = await fs.getDoc(ref);
    const remote = snap.exists() ? snap.data() : null;
    if(remote && remote.updatedAt > (state.updatedAt||0)){
      const d = JSON.parse(remote.payload);
      const acc = state.account;
      state = d; state.account = acc;
      migratePresets(); migrateSingleGym(); pruneEmptySessions();
      state.account.syncedAt = Date.now();
      save(); renderTrain(); renderWeight();
      if(loud) toast("クラウドの記録を読み込みました");
    }else{
      await cloudPush(); save();
      if(loud) toast("同期しました");
    }
  }catch(e){
    console.error(e);
    if(loud) toast("同期できませんでした");
  }
}

    const b = document.createElement("button");
    b.textContent = txt;
    b.onclick = ()=>{ document.getElementById("ai-in").value = txt; sendAI(); };
    sug.appendChild(b);
  });
  window.scrollTo(0, document.body.scrollHeight);
}
function aiAppend(role, content){
  if(!Array.isArray(state.aiChat)) state.aiChat = [];
  state.aiChat.push({role, content});
  if(state.aiChat.length > 40) state.aiChat = state.aiChat.slice(-40);
  save(); renderAI();
}
async function sendAI(){
  if(aiBusy) return;
  const inp = document.getElementById("ai-in");
  const text = (inp.value||"").trim();
  if(!text) return;
  if(aiLeft() <= 0){ openPlanSheet("ai"); return; }
  inp.value = "";
  aiAppend("user", text);

  aiBusy = true;
  document.getElementById("ai-send").disabled = true;
  const log = document.getElementById("ai-log");
  const wait = document.createElement("div");
  wait.className = "ai-msg ai"; wait.textContent = "考えています…";
  log.appendChild(wait);
  window.scrollTo(0, document.body.scrollHeight);

  try{
    const msgs = state.aiChat.slice(-10).map(m=> ({role:m.role, content:m.content}));
    msgs[msgs.length-1] = {role:"user", content: aiContext()+"\n\n【相談】\n"+text};
    const answer = await callAI(msgs);
    aiConsume();
    aiAppend("assistant", answer || "うまく答えられませんでした。もう一度お願いします。");
  }catch(e){
    console.warn(e);
    wait.remove();
    const d = document.createElement("div");
    d.className = "ai-msg sys";
    d.textContent = (e && e.message==="no-endpoint")
      ? "AIの接続先が未設定です。設定（⚙）→「AI相談の接続」でAPIキーを入れるか、AI_CONFIG.endpoint に自分のサーバーを設定してください。"
      : "つながりませんでした。電波か接続設定を確認してください。";
    log.appendChild(d);
  }finally{
    aiBusy = false;
    const btn = document.getElementById("ai-send");
    if(btn) btn.disabled = false;
  }
}
async function callAI(msgs){
  if(AI_CONFIG.endpoint){
    const r = await fetch(AI_CONFIG.endpoint, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({system:AI_SYSTEM, messages:msgs, plan:planId(),
                            uid:(state.account&&state.account.uid)||null})
    });
    if(!r.ok) throw new Error("http-"+r.status);
    const d = await r.json();
    return d.text || (Array.isArray(d.content) ? d.content.filter(x=>x.type==="text").map(x=>x.text).join("\n") : "");
  }
  const key = (state.ui && state.ui.aiKey) || "";
  if(!key) throw new Error("no-endpoint");
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body: JSON.stringify({model:AI_CONFIG.model, max_tokens:AI_CONFIG.maxTokens,
                          system:AI_SYSTEM, messages:msgs})
  });
  if(!r.ok) throw new Error("http-"+r.status);
  const d = await r.json();
  return (d.content||[]).filter(x=> x.type==="text").map(x=> x.text).join("\n");
}
